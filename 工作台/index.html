<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>广告周检工作台</title>
<style>
:root{--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e1e0d9;--axis:#c3c2b7;--accent:#2a78d6;--accent-soft:#e3eefb;--accent-ink:#184f95;
--good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;--up-good:#006300;--st-ok:#2a78d6;--st-rej:#eb6834;--st-done:#1baf7a;--st-ver:#eda100;--st-wait:#898781;--st-void:#d6d5cf;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--line:#2c2c2a;--axis:#383835;--accent:#3987e5;--accent-soft:#16283f;--accent-ink:#9ec5f4;
--up-good:#0ca30c;--st-ok:#3987e5;--st-rej:#d95926;--st-done:#199e70;--st-ver:#c98500;--st-void:#383835;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}section{scroll-margin-top:104px}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;flex:1 1 0;min-width:180px;overflow:hidden}.brand b{font-size:18px;line-height:1.25}.brand span{color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink2);background:var(--surface);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px}.btn:hover{border-color:var(--axis)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:8px 18px;font-size:15px}
.btn.primary:disabled{opacity:.55;cursor:wait}.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:6px}.btn.ghost{border-color:transparent;color:var(--ink2)}.btn.ok{border-color:var(--st-ok);color:var(--accent-ink)}.btn.no{border-color:var(--st-rej)}
select,input[type=number],input[type=text]{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px}
nav{max-width:1280px;margin:0 auto;padding:0 20px 8px;display:flex;gap:4px;overflow-x:auto}nav a{color:var(--ink2);text-decoration:none;font-size:13px;padding:3px 10px;border-radius:999px;white-space:nowrap}nav a:hover{background:var(--accent-soft);color:var(--accent-ink)}
main{max-width:1280px;margin:0 auto;padding:16px 20px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin:0 0 14px}
h2{font-size:19px;margin:0;display:flex;align-items:center;gap:10px}h2 .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
h2 small{font-weight:400;color:var(--ink2);font-size:13px}h3{font-size:14px;color:var(--ink2);margin:16px 0 8px;font-weight:600}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.sec-head .sp{margin-left:auto}
/* Loop 六动作 */
.loop{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.lstep{border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:74px;background:var(--surface);transition:border-color .2s,background .2s}
.lstep .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}.lstep .k{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--axis);color:var(--ink2);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.lstep .d{font-size:12.5px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.lstep.open .d{-webkit-line-clamp:unset}.lstep ul{margin:4px 0 0 16px;padding:0;font-size:12px;color:var(--ink2);display:none}.lstep.open ul{display:block}
.lstep.done{border-color:var(--accent)}.lstep.done .k{background:var(--accent);border-color:var(--accent);color:#fff}.lstep.fail{border-color:var(--critical)}.lstep.fail .k{background:var(--critical);border-color:var(--critical);color:#fff}
.lstep.now{background:var(--accent-soft);border-color:var(--accent)}.lstep.now .k{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.18)}}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .l{font-size:12.5px;color:var(--ink2)}.tile .v{font-size:26px;font-weight:600;line-height:1.2;margin:2px 0}.tile .s{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta.good{color:var(--up-good)}.delta.bad{color:var(--critical)}.spark{display:block;margin-top:6px;width:100%;height:28px}.meter{height:8px;border-radius:4px;margin-top:10px;overflow:hidden;background:color-mix(in srgb,var(--mc) 20%,var(--surface))}.meter i{display:block;height:100%;border-radius:4px;background:var(--mc)}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink);white-space:nowrap}.stat svg{flex:none}
/* 通用 */
.grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{color:var(--ink2);font-weight:500;font-size:12.5px;white-space:nowrap}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}.an td:first-child{white-space:nowrap}.an b{font-weight:600}
.col{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}.col h4{margin:0 0 6px;font-size:13.5px}.col ol,.col ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink)}.col li{margin:0 0 7px}.col li b{font-weight:600}
code{background:var(--accent-soft);border-radius:4px;padding:0 4px;font-size:12.5px}
.tabs{display:flex;gap:6px;margin:14px 0 8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink2)}.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.form{display:grid;gap:10px}.form label{display:grid;gap:3px;font-size:12.5px;color:var(--ink2)}.form .row{display:flex;gap:8px;align-items:center}.form input,.form select{width:100%}.hint{font-size:12.5px;color:var(--ink2)}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .h{display:flex;align-items:center;gap:8px;font-weight:600}.opt .h .key{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--axis);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;flex:none}.opt.on .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt p{margin:0;font-size:12.5px;color:var(--ink2)}.opt .c{font-size:12.5px;color:var(--ink)}.chip{display:inline-block;border-radius:999px;background:var(--page);border:1px solid var(--line);padding:0 8px;font-size:12px;color:var(--ink2);white-space:nowrap}
.sbar{display:flex;gap:2px;height:14px;margin:4px 0 8px}.sbar i{display:block;height:100%;border-radius:4px;min-width:3px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.grp{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--page);font-weight:600;font-size:14px}.grp>summary::-webkit-details-marker{display:none}
.grp>summary:before{content:"▸";color:var(--muted);font-size:12px}.grp[open]>summary:before{content:"▾"}.grp .sp{margin-left:auto;display:flex;gap:8px;align-items:center;font-weight:400}
tr.void td{color:var(--muted);text-decoration:line-through}tr.void td:last-child{text-decoration:none}.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}.st i{width:9px;height:9px;border-radius:3px;display:inline-block}
.ops{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.rej{display:flex;gap:6px;margin-top:6px}.rej input{flex:1;min-width:160px;font-size:12.5px;padding:4px 8px}.note{font-size:12.5px;color:var(--ink2);margin-top:3px}.note.warn{color:var(--ink)}
.arrow{color:var(--muted);margin:0 4px}.cardf{border:1px solid var(--line);border-radius:10px;margin-top:8px}.cardf summary{padding:8px 12px;cursor:pointer;font-size:13.5px;font-weight:600}.cardf div{padding:0 12px 10px;font-size:13px;color:var(--ink)}.cardf.key{border-color:var(--accent);background:var(--accent-soft)}
.log{max-height:300px;overflow:auto;font-size:12.5px}.log div{padding:5px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:118px 64px 78px 1fr;gap:8px}.log span{color:var(--ink2)}
.empty{text-align:center;padding:60px 20px}.empty p{color:var(--ink2);max-width:560px;margin:8px auto 18px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:80vw}#toast.show{opacity:1}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.opts{grid-template-columns:repeat(2,1fr)}.loop{grid-template-columns:repeat(3,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.opts,.loop{grid-template-columns:1fr}main,.bar,nav{padding-left:16px;padding-right:16px}.log div{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="bar">
  <div class="brand"><b>广告周检工作台</b><span id="meta">加载中…</span></div>
  <span class="pill" id="badge" title=""></span>
  <label class="pill">我是 <select id="who" style="border:0;padding:0 2px;background:transparent"></select></label>
  <span class="pill" id="tstatus"><i class="dot"></i><span></span></span>
  <a class="btn" href="/flow" target="_blank">流程图</a>
  <a class="btn" href="/report" target="_blank">运行报告</a>
  <button class="btn ghost" id="reset">重置</button>
  <button class="btn primary" id="run">跑一圈</button>
</div><nav><a href="#loop">Loop 六动作</a><a href="#s1">① 发现异常</a><a href="#s2">② 判断原因</a><a href="#s3">③ 制定动作</a><a href="#s4">④ 调用工具执行</a><a href="#s5">⑤ 复盘学习</a></nav></header>
<main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s), h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>h(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
const usd=v=>"$"+Math.round(v).toLocaleString("en-US"), pct=(v,n=1)=>(v*100).toFixed(n)+"%";
let S=null, UI={tab:"分组账",openGroups:new Set(),showVoid:false,stFilter:"全部",opts:null,rejecting:null,openSteps:new Set(),playing:false};
const who=()=>$("#who").value;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3800)}
async function api(path,body){const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({who:who(),...body})}:{});const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||("出错了："+r.status));throw new Error(j.error)}return j}
const ST={"待确认":"--st-wait","已确认":"--st-ok","驳回":"--st-rej","已执行":"--st-done","已验证":"--st-ver","作废":"--st-void"}, ST_ORDER=["待确认","已确认","已执行","已验证","驳回","作废"];
const stHtml=s=>`<span class="st"><i style="background:var(${ST[s]})"></i>${h(s)}</span>`;
const ICON={critical:`<svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1l6.2 11H.8z" fill="var(--critical)"/><rect x="6.3" y="5" width="1.4" height="4" fill="#fff"/><rect x="6.3" y="9.8" width="1.4" height="1.4" fill="#fff"/></svg>`,
serious:`<svg width="14" height="14" viewBox="0 0 14 14"><rect x="1.5" y="1.5" width="11" height="11" rx="2" transform="rotate(45 7 7)" fill="var(--serious)"/><rect x="6.3" y="3.8" width="1.4" height="4.2" fill="#fff"/><rect x="6.3" y="8.9" width="1.4" height="1.4" fill="#fff"/></svg>`,
warning:`<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="var(--warning)"/><rect x="6.3" y="3.5" width="1.4" height="4.4" fill="#0b0b0b"/><rect x="6.3" y="8.9" width="1.4" height="1.4" fill="#0b0b0b"/></svg>`,
good:`<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="var(--good)"/><path d="M4 7.2l2.1 2.1L10 5.3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const LV={critical:"严重",serious:"要管",warning:"留意",good:"正常"};
const stat=l=>`<span class="stat">${ICON[l]}${LV[l]}</span>`;
function spark(vals,fmt,labels){const w=120,hh=28,p=4,mn=Math.min(...vals),mx=Math.max(...vals),x=i=>p+i*(w-2*p)/(vals.length-1),y=v=>hh-p-(mx===mn?.5:(v-mn)/(mx-mn))*(hh-2*p);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" role="img" aria-label="近四周趋势"><polyline points="${pts}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="7" fill="transparent"><title>${h(labels[i])}：${h(fmt(v))}</title></circle>`).join("")}<circle cx="${x(vals.length-1)}" cy="${y(vals.at(-1))}" r="3.2" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function delta(cur,prev,upGood,asPt){const d=asPt?(cur-prev)*100:(cur/prev-1)*100, good=(d>=0)===upGood;return `<span class="delta ${Math.abs(d)<0.05?"":(good?"good":"bad")}">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(asPt?1:0)}${asPt?" 个点":"%"}</span><span>较上周</span>`}

function render(){
  const m=S.meta,t=S.task;$("#meta").textContent=`${m.店铺}｜${m.产品}｜数据 ${m.周期}`;$("#badge").textContent=(m.数据标记||"").split("：")[0];$("#badge").title=m.数据标记;
  const col={"待处理":"--warning","处理中":"--accent","待核对":"--st-ok","已完成":"--good","遇到问题":"--critical"}[t.status]||"--muted";
  $("#tstatus").innerHTML=`<i class="dot" style="background:var(${col})"></i><span>${h(t.id)} · ${h(t.status)}${t.version?` · v${t.version}`:""}</span>`;
  $("#run").disabled=S.progress.running||UI.playing;$("#run").textContent=(S.progress.running||UI.playing)?"Agent 正在跑…":(S.hasRun?"跑一圈":"跑第一圈");
  const F=S.facts; let out=loopHtml();
  if(!S.hasRun){out+=`<div class="card empty"><h2 style="justify-content:center">任务 ${h(t.id)} 已建好，状态「${h(t.status)}」</h2><p>目标 ACOS ${pct(t.target_acos,0)}、补货到仓 ${t.arrive_weeks} 周、${h(t.stage)}。点右上角「跑第一圈」：Agent 读状态、跑分析、过验证器、把结果写进工作台，然后停下来等人。</p><button class="btn primary" onclick="runLoop()">跑第一圈</button></div>`;$("#app").innerHTML=out;return}
  out+=kpiHtml(F)+s1(F)+s2(F)+s3()+s4()+s5(F);$("#app").innerHTML=out;
}
const LOOP=["读取状态","判断下一步","执行","验证","写入状态","判断停止条件"];
function loopHtml(){const steps=S.progress.steps||[],by={};steps.forEach(s=>by[s.i]=s);const shown=UI.playing?UI.shown:99,cur=UI.playing?UI.cur:0;
  return `<section class="card" id="loop"><div class="sec-head"><h2>Loop 六动作 <small>模型可以忘，系统状态不能忘</small></h2><span class="sp hint">${steps.length?`上一圈 ${steps.at(-1).t} 秒跑完，点格子看细节`:"还没跑过"}</span></div><div class="loop">${LOOP.map((n,k)=>{const i=k+1,s=by[i]&&steps.indexOf(by[i])<shown?by[i]:null;
  return `<div class="lstep ${s?(s.ok?"done":"fail"):""} ${cur===i?"now":""} ${UI.openSteps.has(i)?"open":""}" onclick="tog(${i})"><div class="t"><span class="k">${i}</span>${n}</div><div class="d">${s?h(s.detail):(cur===i?"…":"")}</div>${s&&s.extra&&s.extra.length?`<ul>${s.extra.map(e=>`<li>${h(e)}</li>`).join("")}</ul>`:""}</div>`}).join("")}</div></section>`}
function tog(i){UI.openSteps.has(i)?UI.openSteps.delete(i):UI.openSteps.add(i);render()}
function kpiHtml(F){const W=F.逐周,Y=F.四周,I=F.库存,lab=W.map(w=>w.周),L=W.at(-1),Pv=W.at(-2),R=S.task.arrive_weeks,lv=k=>F.异常.find(a=>a.指标===k)?.级别||"good";
  const mc={critical:"--critical",serious:"--serious",warning:"--warning",good:"--accent"}[lv("库存够卖几周")];
  const T=(l,v,s,sp)=>`<div class="tile"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div>${sp||""}</div>`;
  return `<div class="kpis">${T("上周销售额",usd(L.销售额),delta(L.销售额,Pv.销售额,true),spark(W.map(w=>w.销售额),usd,lab))}${T("上周广告费",usd(L.广告费),delta(L.广告费,Pv.广告费,false),spark(W.map(w=>w.广告费),usd,lab))}
  ${T("TACOS（四周）",pct(Y.TACOS),`${stat(lv("TACOS"))}<span>盈亏线 ${pct(Y.盈亏线)}</span>`,spark(W.map(w=>w.TACOS),v=>pct(v),lab))}${T("SP 的 ACOS（近 14 天）",pct(F["SP-近14天"].ACOS),`${stat(lv("SP 的 ACOS"))}<span>目标 ${pct(S.task.target_acos,0)}</span>`,spark(W.map(w=>w.SP_ACOS),v=>pct(v),lab))}
  ${T("库存够卖",I.整体可售周数.toFixed(1)+" 周",`${stat(lv("库存够卖几周"))}<span>${R==null?"补货周数没填":"补货要 "+R+" 周"}</span>`,`<div class="meter" style="--mc:var(${mc})" title="可售周数 ÷ 到仓周数"><i style="width:${Math.min(100,I.整体可售周数/Math.max(R,.1)*100).toFixed(0)}%"></i></div>`)}${T("上周退款率",pct(L.退款率),`${stat(lv("退款率"))}${delta(L.退款率,Pv.退款率,false,true)}`,spark(W.map(w=>w.退款率),v=>pct(v),lab))}</div>`}
