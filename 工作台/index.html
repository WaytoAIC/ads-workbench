<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>广告周检工作台</title>
<style>
:root{--page:#f3f4f6;--surface:#fff;--surface2:#f8f9fb;--ink:#111318;--ink2:#4b5162;--muted:#8a909d;--line:#e3e5ea;--line2:#eef0f3;--axis:#c8ccd4;
--accent:#2a6fdb;--accent-h:#1f5fc4;--accent-soft:#e9f1fd;--accent-ink:#1a4c99;
--good:#12a150;--good-soft:#e6f6ed;--warning:#f0a817;--warn-soft:#fdf5e2;--serious:#ec835a;--critical:#d63a3a;--crit-soft:#fcebeb;--up-good:#0d7a3c;
--st-ok:#2a6fdb;--st-rej:#e0602e;--st-done:#15a374;--st-ver:#d99a00;--st-wait:#8a909d;--st-void:#c8ccd4;
--side:#151820;--side2:#1e222c;--side-ink:#eceef2;--side-muted:#8d94a3;--side-line:#272c37;
--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--shadow-lg:0 16px 40px rgba(16,24,40,.18);--ring:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0d0e11;--surface:#16181d;--surface2:#1b1e24;--ink:#f1f2f4;--ink2:#b3b8c3;--muted:#7c8391;--line:#2a2e37;--line2:#21242b;--axis:#3a3f4a;
--accent:#3d84ea;--accent-h:#5a97ee;--accent-soft:#15243a;--accent-ink:#9cc2f6;--good-soft:#10291b;--warn-soft:#2c2412;--crit-soft:#331818;--up-good:#2fc06d;--st-ok:#3d84ea;--st-void:#3a3f4a;
--side:#0a0b0e;--side2:#15171c;--side-line:#1f232b;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:14.5px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── 外壳：侧栏 + 主区 ── */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 14px;gap:18px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}.logo .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3d84ea,#1f5fc4);display:flex;align-items:center;justify-content:center;flex:none}
.logo .mk svg{stroke:#fff;width:19px;height:19px}.logo b{display:block;font-size:15px;line-height:1.25}.logo small{display:block;color:var(--side-muted);font-size:11.5px;letter-spacing:.04em}
.tcard{background:var(--side2);border:1px solid var(--side-line);border-radius:10px;padding:11px 12px;font-size:12.5px}
.tcard .r{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--side-muted)}.tcard .r+.r{margin-top:6px}.tcard b{color:var(--side-ink);font-weight:600}
.tcard .id{font-size:14px;font-weight:600;color:var(--side-ink)}
.glabel{font-size:11px;letter-spacing:.08em;color:var(--side-muted);padding:0 10px;margin-bottom:6px;text-transform:uppercase}
.snav{display:flex;flex-direction:column;gap:2px}
.snav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-muted);text-decoration:none;font-size:13.5px;transition:background .15s,color .15s;white-space:nowrap}
.snav a:hover{background:var(--side2);color:var(--side-ink)}.snav a.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:#fff}.snav a.on svg{stroke:#8db8f5}
.snav .sn{width:18px;height:18px;border-radius:5px;border:1.5px solid currentColor;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}.snav a.on .sn{border-color:#8db8f5;color:#8db8f5}
.snav .ct{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;background:var(--side-line);color:var(--side-ink)}
.snav .ct.hot{background:var(--critical);color:#fff}.snav .ct.warn{background:var(--warning);color:#1b1300}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--side-line);padding-top:14px}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--side-ink);cursor:pointer;padding:0 6px}.sw input{display:none}
.sw .tr{width:34px;height:20px;border-radius:999px;background:var(--side-line);position:relative;transition:background .2s;flex:none}.sw .tr:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.tr{background:var(--accent)}.sw input:checked+.tr:after{transform:translateX(14px)}.sw small{display:block;color:var(--side-muted);font-size:11.5px}
.dmark{font-size:11.5px;color:var(--side-muted);padding:0 6px;line-height:1.5}

/* ── 顶栏 ── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1360px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ttl{flex:1 1 260px;min-width:0}.ttl .crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}.ttl h1{margin:1px 0 0;font-size:18px;line-height:1.3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ttl .meta{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 11px;font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.seg .n{font-size:11.5px;color:var(--muted);font-weight:500}.seg button.on .n{color:var(--accent)}
.flabel{font-size:12px;color:var(--muted);margin-right:-6px}
.spill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.spill i{width:8px;height:8px;border-radius:50%;background:var(--c)}.spill.live i{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.3}}
.vtag{font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}

/* ── 按钮体系 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s,color .15s;position:relative}
.btn:hover{border-color:var(--axis);background:var(--surface2)}.btn:focus-visible{outline:0;box-shadow:var(--ring)}.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(31,95,196,.3)}.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.lg{height:40px;padding:0 20px;font-size:14.5px;border-radius:9px}.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px;gap:5px}.btn.sm svg.i{width:14px;height:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.success{background:var(--good);border-color:var(--good);color:#fff;font-weight:600}.btn.success:hover{filter:brightness(.94)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}.btn.soft:hover{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.btn.danger{border-color:color-mix(in srgb,var(--critical) 45%,var(--line));color:var(--critical)}.btn.danger:hover{background:var(--crit-soft);border-color:var(--critical)}
.btn.danger.solid{background:var(--critical);border-color:var(--critical);color:#fff}
.btn.locked{opacity:.62}.btn.locked .lk{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--ink2);display:flex;align-items:center;justify-content:center}.btn.locked .lk svg{width:10px;height:10px;stroke:var(--surface);stroke-width:2.4}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.tsep{width:1px;height:24px;background:var(--line)}

/* ── 主区与面板 ── */
main{max-width:1360px;margin:0 auto;padding:22px 28px 90px}
section{scroll-margin-top:84px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line2)}
.ph .no{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.ph .no svg{stroke:var(--accent-ink)}.ph h2{margin:0;font-size:16.5px;line-height:1.3}.ph .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.ph .tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pb{padding:18px 20px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--line2)}.toolbar .r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub-h{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:8px}.sub-h .hint{font-weight:400}
.box{border:1px solid var(--line);border-radius:11px;background:var(--surface);min-width:0}.box .bh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:13px;font-weight:600}.box .bh .r{margin-left:auto;font-weight:400}.box .bb{padding:12px 14px}
.hint{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:16px}
code{background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:0 5px;font-size:12.5px}

/* 结论横幅 */
.banner{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(90deg,var(--warn-soft),var(--surface) 75%);border:1px solid color-mix(in srgb,var(--warning) 40%,var(--line));border-radius:14px;padding:14px 18px;margin:0 0 18px;font-size:15px}
.banner .ic{width:34px;height:34px;border-radius:9px;background:var(--warning);display:flex;align-items:center;justify-content:center;flex:none}.banner .ic svg{stroke:#1b1300}
.banner .k{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.04em;margin-bottom:2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px 11px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lc,transparent)}
.tile .l{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .v{font-size:25px;font-weight:650;line-height:1.2;margin:4px 0 3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{font-weight:600}.delta.good{color:var(--up-good)}.delta.bad{color:var(--critical)}.spark{display:block;margin-top:8px;width:100%;height:28px}
.meter{height:7px;border-radius:4px;margin-top:12px;overflow:hidden;background:color-mix(in srgb,var(--mc) 18%,var(--surface))}.meter i{display:block;height:100%;border-radius:4px;background:var(--mc)}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink);white-space:nowrap;font-weight:500}.stat svg{flex:none}

/* Loop 六动作 */
.loop{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;counter-reset:s}
.lstep{position:relative;border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-height:84px;background:var(--surface2);cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s}
.lstep:hover{border-color:var(--axis)}
.lstep:not(:last-child):after{content:"";position:absolute;right:-12px;top:22px;width:12px;height:2px;background:var(--line)}
.lstep.done:not(:last-child):after{background:var(--accent)}
.lstep .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}.lstep .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--axis);color:var(--ink2);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--surface)}
.lstep .d{font-size:12.5px;color:var(--ink2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.lstep.open .d{-webkit-line-clamp:unset}
.lstep ul{margin:6px 0 0 16px;padding:0;font-size:12px;color:var(--ink2);display:none}.lstep.open ul{display:block}
.lstep.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--surface)}.lstep.done .k{background:var(--accent);border-color:var(--accent);color:#fff}
.lstep.fail{border-color:var(--critical);background:var(--crit-soft)}.lstep.fail .k{background:var(--critical);border-color:var(--critical);color:#fff}
.lstep.now{background:var(--accent-soft);border-color:var(--accent);box-shadow:var(--ring)}.lstep.now .k{animation:pulse 1s infinite;border-color:var(--accent);color:var(--accent)}@keyframes pulse{50%{transform:scale(1.18)}}

/* 表格 */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--line2);padding:8px 12px;text-align:left;vertical-align:top}
thead th{background:var(--surface2);color:var(--ink2);font-weight:600;font-size:12px;white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.an td:first-child{white-space:nowrap}.an b{font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--ink2)}

/* 输入表单 */
.form{display:grid;gap:12px}.fld{display:grid;gap:5px}.fld>span{font-size:12.5px;color:var(--ink2);font-weight:500;display:flex;justify-content:space-between}.fld>span em{font-style:normal;color:var(--muted);font-weight:400;font-size:11.5px}
.ipt{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;transition:border-color .15s,box-shadow .15s}.ipt:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.ipt input,.ipt select{flex:1;min-width:0;border:0;background:transparent;padding:7px 10px;outline:0}.ipt .u{padding:0 10px;color:var(--muted);font-size:12.5px;border-left:1px solid var(--line2);align-self:stretch;display:flex;align-items:center;background:var(--surface2)}
.frow{display:flex;gap:8px;flex-wrap:wrap}.tip{display:flex;gap:8px;align-items:flex-start;background:var(--surface2);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--ink2)}.tip svg{stroke:var(--accent);margin-top:2px}

/* 证据三栏 */
.evi{border:1px solid var(--line);border-radius:11px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.evi .eh{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line2);background:color-mix(in srgb,var(--c) 9%,var(--surface))}.evi .eh i{width:8px;height:8px;border-radius:2px;background:var(--c)}.evi .eh small{font-weight:400;color:var(--muted);font-size:11.5px}
.evi ol,.evi ul{margin:0;padding:12px 14px 6px 32px;font-size:13px}.evi li{margin:0 0 8px}.evi li b{font-weight:600}
.utabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 12px;overflow-x:auto}.utab{border:0;background:transparent;padding:8px 12px;font-size:13.5px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.utab:hover{color:var(--ink)}.utab.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}

/* 取舍选项 */
.opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface);transition:border-color .15s,box-shadow .15s,background .15s}
.opt:hover{border-color:var(--axis);box-shadow:var(--shadow)}.opt.on{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.opt .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}.opt .key{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--axis);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none;background:var(--surface)}
.opt.on .key{background:var(--accent);border-color:var(--accent);color:#fff}.opt .ck{margin-left:auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--axis);display:flex;align-items:center;justify-content:center;flex:none}.opt.on .ck{background:var(--accent);border-color:var(--accent)}.opt .ck svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0}.opt.on .ck svg{opacity:1}
.opt p{margin:0;font-size:12.5px;color:var(--ink2)}.opt .c{font-size:12.5px;color:var(--ink);background:var(--warn-soft);border-radius:7px;padding:7px 9px}.opt .m{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);padding:0 8px;font-size:11.5px;color:var(--ink2);white-space:nowrap;font-weight:500;line-height:20px}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}.chip.warn{background:var(--warn-soft);border-color:transparent;color:#8a5a00}

/* 动作清单 */
.sbar{display:flex;gap:2px;height:10px;margin:0 0 8px;border-radius:5px;overflow:hidden}.sbar i{display:block;height:100%;min-width:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:6px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}.legend b{color:var(--ink)}
.grp{border:1px solid var(--line);border-radius:11px;margin-top:12px;overflow:hidden;background:var(--surface)}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);font-weight:600;font-size:14px}.grp>summary::-webkit-details-marker{display:none}
.grp>summary .chev{transition:transform .2s;stroke:var(--muted)}.grp[open]>summary .chev{transform:rotate(90deg)}.grp[open]>summary{border-bottom:1px solid var(--line)}
.grp .sp{margin-left:auto;display:flex;gap:8px;align-items:center;font-weight:400}.grp table th{background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;border-radius:999px;padding:1px 9px 1px 7px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink)}.badge i{width:7px;height:7px;border-radius:50%;background:var(--c)}
tr.void td{color:var(--muted);text-decoration:line-through}tr.void td:last-child{text-decoration:none}
.ops{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.grp .acts td:nth-child(2){min-width:220px}.grp .acts td:nth-child(3){min-width:190px}.grp .acts td:nth-child(5){min-width:200px}.detail .acts td:first-child{min-width:200px}.acts th:last-child,.acts td:last-child{min-width:300px}.acts .ops{flex-wrap:nowrap}.ops .badge{margin-right:4px}
.rej{display:flex;gap:6px;margin-top:8px;align-items:center}.rej .ipt{flex:1;min-width:180px}.rej .ipt input{padding:4px 8px;font-size:12.5px}
.note{font-size:12px;color:var(--muted);margin-top:4px}.note.warn{color:#8a5a00;background:var(--warn-soft);border-radius:6px;padding:2px 7px;display:inline-block}
.arrow{color:var(--muted);margin:0 5px}.nv{font-weight:600;color:var(--accent-ink)}
.cmp{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:11px;padding:11px 15px;margin:0 0 14px;font-size:13.5px}.cmp b{font-size:16px}.cmp .chg{color:var(--ink2)}.cmp .chg b{font-size:13.5px;color:var(--ink)}

/* 复盘 */
.cardf{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--surface)}.cardf summary{padding:9px 13px;cursor:pointer;font-size:13.5px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}.cardf summary::-webkit-details-marker{display:none}
.cardf summary .chev{stroke:var(--muted);transition:transform .2s}.cardf[open] summary .chev{transform:rotate(90deg)}.cardf>div{padding:0 13px 11px 37px;font-size:13px}.cardf.key{border-color:var(--accent);background:var(--accent-soft)}
.log{max-height:320px;overflow:auto;font-size:12.5px}.log div{padding:7px 14px;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:120px 70px 84px 1fr;gap:10px}.log div:last-child{border-bottom:0}.log span{color:var(--muted)}
.prov{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:11px 14px;margin-top:16px}.prov svg{stroke:var(--muted);margin-top:2px}

.empty{text-align:center;padding:56px 20px}.empty .ic{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}.empty .ic svg{width:26px;height:26px;stroke:var(--accent)}
.empty h2{margin:0;font-size:19px}.empty p{color:var(--ink2);max-width:560px;margin:8px auto 20px}
.loading{padding:80px;text-align:center;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:80vw;display:flex;gap:9px;align-items:center;box-shadow:var(--shadow-lg)}#toast.show{opacity:1;transform:translate(-50%,0)}#toast svg{stroke:#4ade80}
#modal{position:fixed;inset:0;background:rgba(10,12,16,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}#modal.show{display:flex}
#modal .mbox{background:var(--surface);color:var(--ink);border-radius:16px;max-width:520px;width:100%;box-shadow:var(--shadow-lg);overflow:hidden}
#modal .mh{display:flex;gap:12px;align-items:center;padding:18px 22px 6px}#modal .mh .ic{width:38px;height:38px;border-radius:10px;background:var(--crit-soft);display:flex;align-items:center;justify-content:center;flex:none}#modal .mh .ic svg{stroke:var(--critical);width:20px;height:20px}
#modal .mh b{font-size:16px}#modal .mm{padding:4px 22px 18px 72px;font-size:15px;line-height:1.65;color:var(--ink2)}#modal .mf{display:flex;justify-content:flex-end;padding:12px 22px;background:var(--surface2);border-top:1px solid var(--line2)}

/* 诊断树：异常 → 分析 → 诊断 → 动作 */
.tree{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 52px}
#edges{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
#edges path{fill:none;stroke:var(--axis);stroke-width:1.4;transition:stroke .15s,opacity .15s}#edges path.hot{stroke:var(--accent);stroke-width:2.4}#edges path.faint{opacity:.18}
.tcol{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;min-width:0}
.tch{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 8px;padding:0 2px 8px;border-bottom:2px solid var(--line);margin-bottom:4px}.tch b{font-size:14px;white-space:nowrap}.tch small{grid-column:1/-1}.tch .st{width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;align-self:center;flex:none}
.tch small{font-size:11.5px;color:var(--muted)}
.node{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);cursor:pointer;font-size:12.5px;line-height:1.45;transition:border-color .15s,box-shadow .15s,opacity .15s;position:relative}
.node:hover{border-color:var(--axis)}.node.on{border-color:var(--accent);box-shadow:var(--ring)}.node.inpath{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}.node.faint{opacity:.32}
.node.off{background:var(--surface2);color:var(--ink2)}.node .t{font-weight:600;color:var(--ink);display:flex;gap:6px;align-items:flex-start}.node .t .stat{font-weight:600}
.node .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:11.5px}.node .v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.node .hid{font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 5px;flex:none;line-height:18px}
.node .key{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--axis);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;background:var(--surface)}
.node.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.node .ck{margin-left:auto;width:17px;height:17px;border-radius:5px;border:1.5px solid var(--axis);display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface)}.node .ck svg{width:11px;height:11px;stroke:#fff;stroke-width:3;opacity:0}
.node.sel .ck{background:var(--accent);border-color:var(--accent)}.node.sel .ck svg{opacity:1}
.vd{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;line-height:18px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink)}
.chn{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:16px;white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:4px;font-size:11px;border-radius:5px;padding:0 6px;line-height:19px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}.src svg{width:11px;height:11px}
.detail{margin-top:20px;border:1px solid var(--accent);border-radius:12px;overflow:hidden;background:var(--surface)}
.detail .dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--accent-soft);font-size:12.5px;color:var(--ink2)}.detail .dh b{color:var(--ink);font-size:14.5px}.detail .dh .r{margin-left:auto;display:flex;gap:8px}
.detail .db{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 12px;font-size:13px}.kv>span{color:var(--muted)}.kv>div{min-width:0}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}.facts li{font-size:12.5px;border-left:3px solid var(--line);padding:2px 0 2px 10px}.facts li .s{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}
.miss{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:12.5px;color:var(--ink2);background:var(--surface2);border:1px dashed var(--axis);border-radius:10px;padding:10px 14px}.miss ul{margin:0;padding-left:16px}.miss svg{stroke:var(--muted);margin-top:2px}
/* 广告字段 */
.cn{font-weight:600;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.sub2{font-size:11.5px;color:var(--ink2)}.idl{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.ent{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;border-radius:4px;padding:0 5px;line-height:17px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);margin-bottom:3px}
.kw{font-weight:600}.mt{font-size:11px;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
/* 执行通道 */
.chs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ch{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.ch .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.ch .h .tag{margin-left:auto}
.ch p{margin:0;font-size:12px;color:var(--ink2)}.ch .nums{display:flex;gap:14px;font-size:12px;color:var(--muted)}.ch .nums b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;line-height:20px;white-space:nowrap}.tag.off{background:var(--warn-soft);color:#8a5a00}.tag.on{background:var(--good-soft);color:var(--up-good)}
.watch{display:flex;gap:12px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px}.watch .big{font-size:26px;font-weight:700;color:var(--accent-ink);line-height:1;white-space:nowrap}.watch .big small{font-size:12px;font-weight:500}
@media(max-width:1180px){.chs{grid-template-columns:repeat(2,minmax(0,1fr))}.detail .db{grid-template-columns:1fr}}
@media(max-width:900px){.tree{grid-template-columns:1fr;gap:18px}#edges{display:none}}
/* 持续运行：历史回放时间线 */
.runs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative;margin-bottom:14px}
.run{position:relative;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-right:22px;background:var(--surface);cursor:pointer;font-size:12px;transition:border-color .15s,box-shadow .15s}
.run:not(:last-child):after{content:"";position:absolute;right:-23px;top:50%;width:22px;height:2px;background:var(--axis)}
.run:hover{border-color:var(--axis)}.run.on{border-color:var(--accent);box-shadow:var(--ring)}.run.now{background:var(--accent-soft)}.run.next{border-style:dashed;background:var(--surface2);cursor:default}
.run .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}.run .t small{font-weight:500;color:var(--muted)}.run .w{color:var(--muted);font-size:11px;margin:2px 0 6px}
.run .k4{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-bottom:6px}.run .k4 span{color:var(--muted)}.run .k4 b{font-variant-numeric:tabular-nums;color:var(--ink)}
.run .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:6px 0 4px;background:var(--line2)}.run .bar i{display:block;height:100%}
.mem{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.mem span{font-size:10.5px;border-radius:4px;padding:0 5px;line-height:17px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent-ink)}
.res{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;white-space:nowrap}.res i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.lvl{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;line-height:17px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);margin-right:4px}
@media(max-width:1100px){.runs{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.run{margin-right:0}.run:after{display:none}}
#hist .acts td:nth-child(2){min-width:150px}#hist .acts td:nth-child(3){min-width:200px}#hist .acts td:nth-child(4){min-width:180px}#hist .acts td:nth-child(6){min-width:230px}#hist .acts td:nth-child(8){min-width:170px}
body.shot .side,body.shot .top{display:none}body.shot .shell{display:block}body.shot main{max-width:1300px;padding:14px 14px 18px}body.shot .panel{margin-bottom:0}
/* 演示模式：投屏放大 */
body.demo{font-size:17px}body.demo table{font-size:15.5px}body.demo th,body.demo td{padding:10px 12px}body.demo .tile .v{font-size:32px}body.demo .tile .l,body.demo .tile .s{font-size:14px}
body.demo .lstep .d{font-size:14px;-webkit-line-clamp:unset}body.demo .lstep .t{font-size:15px}body.demo .ph h2{font-size:20px}body.demo .evi ol,body.demo .evi ul{font-size:15px}body.demo .opt p,body.demo .opt .c{font-size:14px}
body.demo #s4 .grp table th:first-child,body.demo #s4 .grp table td:first-child{display:none}body.demo .btn.sm{font-size:14px;height:32px;padding:0 12px}body.demo .banner{font-size:19px}body.demo #modal .mm{font-size:18px}

@media(max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.opts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1100px){.loop{grid-template-columns:repeat(3,minmax(0,1fr))}.lstep:nth-child(3n):after{display:none}.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:960px){.shell{display:block}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:12px}
 .tcard,.glabel,.side .foot .dmark{display:none}.snav{flex-direction:row;overflow-x:auto;width:100%}.side .grp2{width:100%}.side .foot{margin:0;border:0;padding:0;flex-direction:row;width:100%;justify-content:space-between}
 .topin,main{padding-left:16px;padding-right:16px}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.top .flabel,.tsep{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.opts,.loop{grid-template-columns:1fr}.lstep:after{display:none}.log div{grid-template-columns:1fr 1fr}.ph,.pb,.toolbar{padding-left:14px;padding-right:14px}}

/* ═════════ v2：按「人来干什么」分页，视觉与 VOC 工作台同一套 ═════════ */
:root{--page:#F3F6FB;--surface:#FFFFFF;--surface2:#F7F9FD;--ink:#101B31;--ink2:#56657D;--muted:#8C98AD;--line:#DFE6F1;--line2:#EBF0F7;--axis:#C3CEDF;
--accent:#2257E5;--accent-h:#1B49C7;--accent-soft:#E8EEFF;--accent-ink:#1B45B8;--good:#17895B;--good-soft:#E3F5EC;--warn-soft:#FBF1D9;--warn-ink:#8A5A00;--critical:#C93A31;--crit-soft:#FCE7E5;--up-good:#17895B;
--st-ok:#2257E5;--side:#151B28;--side2:#1D2536;--side-ink:#E8EDF7;--side-muted:#8F9BB1;--side-line:#273045;--side-active:#28324A;--navy:#16264A;
--font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;--r:10px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--navy:#101827;--warn-ink:#E3B34A;--side-active:#232B3D}}
body{font-family:var(--font-body);font-size:14px;line-height:1.6}
h1,h2,h3{margin:0;text-wrap:balance}
.tile .v,.mono,.cn,.idl,.num,td.num,.kv b.n{font-family:var(--font-num)}
.shell{grid-template-columns:212px minmax(0,1fr)}
.side{padding:16px 14px;gap:16px}
.logo small{letter-spacing:0;font-size:11.5px}
.snav a{font-weight:600;font-size:13.5px;padding:8px 10px;color:var(--side-muted)}
.snav a.on{background:var(--side-active);color:#fff}.snav a.on svg{stroke:#fff}
.snav .ct{background:#2F3A52;font-size:11px;font-weight:700}.snav .ct.hot{background:#E5484D;color:#fff}
.side .foot{gap:12px}
.sched{font-size:11.5px;color:var(--side-muted);padding:0 6px;line-height:1.6}.sched i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#34C17B;margin-right:6px;vertical-align:middle}
.top{background:color-mix(in srgb,var(--page) 84%,transparent)}
.topin{max-width:none;padding:10px 28px;gap:12px}
.crumb2{font-weight:700;font-size:13.5px}
.topin .sp{flex:1}
main{max-width:1320px;padding:26px 28px 90px}
.btn{border-radius:8px;font-weight:600}.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn.primary:hover{color:#fff}.btn.success:hover,.btn.danger.solid:hover{color:#fff}.btn.ghost:hover{background:var(--surface2);border-color:transparent}.btn.soft:hover{color:var(--accent-ink)}.btn.danger:hover{color:var(--critical);border-color:var(--critical)}
.panel{border-radius:var(--r);box-shadow:none}.tile{border-radius:8px;box-shadow:none}
/* 页头 */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.pagehead h1{font-size:clamp(22px,2.6vw,28px);font-weight:700;letter-spacing:-.01em}.pagehead p{margin:4px 0 0;color:var(--ink2)}
.pagehead .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 18px}
.card>h3{font-size:15px}.card>.sub{font-size:12.5px;color:var(--ink2);margin:1px 0 6px}
.sec-t{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}.sec-t h3{font-size:15px}.sec-t span{font-size:12.5px;color:var(--muted)}.sec-t .r{margin-left:auto}
/* 首页待办 */
.todo-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 8px;border-top:1px solid var(--line);border-radius:8px;cursor:pointer;transition:background .12s}
.todo-item:first-child{border-top:0}.todo-item:hover{background:var(--surface2)}
.todo-item .t{font-weight:700;font-size:15px}.todo-item p{margin:2px 0 0;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-item .pri{font-family:var(--font-num);font-size:13px;text-align:right;white-space:nowrap;font-weight:600}.todo-item .pri small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:400}
.tg{display:inline-flex;align-items:center;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--accent-soft);color:var(--accent-ink)}
.tg.warn{background:var(--warn-soft);color:var(--warn-ink)}.tg.bad{background:var(--crit-soft);color:var(--critical)}.tg.good{background:var(--good-soft);color:var(--good)}.tg.muted{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.alldone{display:flex;gap:10px;align-items:center;padding:14px 8px;color:var(--ink2)}.alldone svg{stroke:var(--good)}
/* 深色数据带 */
.band{background:var(--navy);color:#fff;border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 14px}
.band h2{font-size:17px}.band p{margin:1px 0 0;font-size:12px;color:#AEBBD3}
.band .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.band .bp{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:4px 12px;font-size:12.5px;background:rgba(255,255,255,.1);color:#fff;white-space:nowrap}.band .bp b{font-family:var(--font-num)}
.band .btn{background:#fff;color:var(--ink);border-color:#fff;height:30px;border-radius:999px;font-size:12.5px}
.goal{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}.goal .fld{width:160px}

<script>
const $=s=>document.querySelector(s), h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const P={play:'<path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',

  refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5"/><path d="M20 3.5v5h-5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',done2:'<path d="M3 12.5l4 4L15 8.5M10 16.5l1 1L21 7.5"/>',
  loop:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',grid:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>',

  plug:'<path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5"/>',cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/>'};

async function api(path,body){const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({who:who(),...body})}:{});const j=await r.json().catch(()=>({}));if(!r.ok){modal(j.error||("出错了："+r.status));throw new Error(j.error)}return j}

function spark(vals,fmt,labels){const w=120,hh=28,p=4,mn=Math.min(...vals),mx=Math.max(...vals),x=i=>p+i*(w-2*p)/(vals.length-1),y=v=>hh-p-(mx===mn?.5:(v-mn)/(mx-mn))*(hh-2*p);

  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" role="img" aria-label="近四周趋势"><polyline points="${pts}" fill="none" stroke="var(--axis)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="7" fill="transparent"><title>${h(labels[i])}：${h(fmt(v))}</title></circle>`).join("")}<circle cx="${x(vals.length-1)}" cy="${y(vals.at(-1))}" r="3.2" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function delta(cur,prev,upGood,asPt){const d=asPt?(cur-prev)*100:(cur/prev-1)*100, good=(d>=0)===upGood;return `<span class="delta ${Math.abs(d)<0.05?"":(good?"good":"bad")}">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(asPt?1:0)}${asPt?" 个点":"%"}</span><span>较上周</span>`}

/* ───────── 总览：Agent 运行 ───────── */
const LOOP=["读取状态","判断下一步","执行","验证","写入状态","判断停止条件"];
function loopHtml(){const steps=S.progress.steps||[],by={};steps.forEach(s=>by[s.i]=s);const shown=UI.playing?UI.shown:99,cur=UI.playing?UI.cur:0;
  const ok=steps.length&&steps.every(s=>s.ok),tools=steps.length?`<span class="chip ${ok?"on":"warn"}">${ok?ic("check","width:12px;height:12px"):""}上一圈 ${steps.at(-1).t} 秒跑完</span><span class="hint">点格子看细节</span>`:`<span class="hint">本次启动后还没跑过</span>`;
  return panel("loop",ic("loop"),"Agent 本周运行","抓数据 → 比目标 → 分析诊断 → 出动作 → 写回状态；模型可以忘，系统状态不能忘",tools,`<div class="loop">${LOOP.map((n,k)=>{const i=k+1,s=by[i]&&steps.indexOf(by[i])<shown?by[i]:null;
  return `<div class="lstep ${s?(s.ok?"done":"fail"):""} ${cur===i?"now":""} ${UI.openSteps.has(i)?"open":""}" onclick="tog(${i})"><div class="t"><span class="k">${s&&s.ok?ic("check","width:12px;height:12px;stroke-width:3"):i}</span>${n}</div><div class="d">${s?h(s.detail):(cur===i?"处理中…":"等待")}</div>${s&&s.extra&&s.extra.length?`<ul>${s.extra.map(e=>`<li>${h(e)}</li>`).join("")}</ul>`:""}</div>`}).join("")}</div>`)}
function tog(i){UI.openSteps.has(i)?UI.openSteps.delete(i):UI.openSteps.add(i);render()}

/* ───────── 持续运行：历史回放（模拟）＋ 本周真实一圈 ───────── */
const RC={"好转":"--good","省下":"--good","持平":"--st-wait","变差":"--critical","看不出":"--st-void","没执行":"--st-rej"};
const MTN={exact:"精确",phrase:"词组",broad:"广泛",negativeExact:"精确否定"};
function histHtml(){const H=S.history;if(!H||!H.圈||!H.圈.length)return "";if(UI.hk==null)UI.hk=H.圈.at(-1).圈;
  const W=S.facts.逐周,ca=S.actions.filter(a=>a.status!=="作废"),cc={};ca.forEach(a=>cc[a.status]=(cc[a.status]||0)+1);
  const card=r=>{const n=r.动作.length,ok=r.动作.filter(a=>a.审批==="通过").length,rj=r.动作.filter(a=>a.审批==="驳回").length,res={};r.动作.forEach(a=>{const k=a.下周结果.结果;res[k]=(res[k]||0)+1});const w=r.周||{};
    return `<div class="run ${UI.hk===r.圈?"on":""}" onclick="UI.hk=${r.圈};render()"><div class="t">第 ${r.圈} 圈 <small>${h(r.运行日)} 周一</small><span class="chip" style="margin-left:auto;line-height:18px">模拟</span></div><div class="w">看 ${h(r.看的数据)}</div>
    <div class="k4"><span>销售额</span><b>${w.销售额!=null?usd(w.销售额):"—"}</b><span>广告费</span><b>${w.广告费!=null?usd(w.广告费):"—"}</b><span>TACOS</span><b>${w.TACOS!=null?pct(w.TACOS):"—"}</b><span>SP ACOS</span><b>${w.SP_ACOS!=null?pct(w.SP_ACOS):"—"}</b></div>
    <div><b>${n}</b> 条动作 · 通过 ${ok} · 驳回 ${rj}</div><div class="bar">${["好转","省下","持平","看不出","变差","没执行"].filter(k=>res[k]).map(k=>`<i style="flex:${res[k]};background:var(${RC[k]})" title="${k} ${res[k]}"></i>`).join("")}</div>
    <div style="color:var(--muted)">下周：${["好转","省下","变差"].filter(k=>res[k]).map(k=>`${k} ${res[k]}`).join(" · ")||"—"}</div>
    ${Object.keys(r.读回||{}).length?`<div class="mem">${Object.entries(r.读回).map(([k,v])=>`<span>${h(k)} ${v}</span>`).join("")}</div>`:`<div class="mem"><span>第一圈，没有上次可读</span></div>`}</div>`};
  const w4=W.at(-1),days=Math.ceil((new Date(S.meta.复盘日)-new Date(S.meta.今天))/864e5);
  const now=`<div class="run now" onclick="goActions('待你决定')"><div class="t">第 ${H.圈.length+1} 圈 <small>本周</small><span class="chip on" style="margin-left:auto;line-height:18px">真实 v${S.task.version}</span></div><div class="w">看 ${h(S.meta.周期)}</div>
    <div class="k4"><span>销售额</span><b>${usd(w4.销售额)}</b><span>广告费</span><b>${usd(w4.广告费)}</b><span>TACOS</span><b>${pct(w4.TACOS)}</b><span>SP ACOS</span><b>${pct(w4.SP_ACOS)}</b></div>
    <div><b>${ca.length}</b> 条动作 · 通过 ${(cc["已确认"]||0)+(cc["已执行"]||0)+(cc["已验证"]||0)} · 驳回 ${cc["驳回"]||0} · 待审批 ${cc["待确认"]||0}</div><div style="color:var(--accent-ink);margin-top:8px">去「行动」里拍板 →</div></div>`;
  const next=`<div class="run next"><div class="t">下一圈 <small>${h(S.meta.复盘日)}</small></div><div class="w">${days} 天后到点自动触发</div><div style="color:var(--ink2)">先读回本周的通过、驳回、执行，再拉新一周数据；没数据就停下来找人。</div><div class="mem"><span>行动卡第 9 格＝它醒来的地方</span></div></div>`;
  const r=H.圈.find(x=>x.圈===UI.hk)||H.圈.at(-1);
  const tb=`<div class="tw"><table class="acts"><thead><tr><th>编号</th><th>改什么（层级 · 类型）</th><th>Campaign / 广告组</th><th>对象</th><th>现值 → 新值</th><th>依据</th><th>人审批</th><th>下周真实表现</th></tr></thead><tbody>${r.动作.map(a=>{const f=a.f||{},v=a.下周结果;
    return `<tr><td class="mono">${h(a.no)}</td><td><span class="lvl">${h(a.level)}</span>${h(a.type)}<div class="sub2">${h(a.field)}</div></td><td>${f.Campaign?`<div class="cn">${h(f.Campaign)}</div>${f.广告组?`<div class="sub2">广告组 ${h(f.广告组)}</div>`:""}`:h(a.campaign)}</td>
    <td>${a.kw?`<span class="kw">${h(a.kw)}</span><span class="mt">${h(MTN[a.match]||a.match)}</span>`:a.target?`<span class="cn">${h(a.target)}</span>`:`<span class="kw">整个活动</span>`}</td>
    <td style="white-space:nowrap">${h(a.old)}<span class="arrow">→</span><span class="nv">${h(a.new)}</span></td><td>${h(a.why)}</td><td>${a.审批==="通过"?stHtml("已执行"):a.审批==="驳回"?stHtml("驳回"):`<span class="hint">${h(a.执行||a.审批)}</span>`}${a.理由?`<div class="note">理由：${h(a.理由)}</div>`:""}</td>

  const tools=`<span class="chip warn">前 ${H.圈.length} 圈是模拟回放</span><span class="chip on">第 ${H.圈.length+1} 圈是本周真实运行</span>`;
  return panel("hist",ic("cal"),"持续运行：每周一跑一圈","每圈先读回上一圈（执行后的新竞价、人的驳回、已暂停的对象、观察期），再出新动作；点一圈看它当时出了什么、下周发生了什么",tools,
   `<div class="runs">${H.圈.map(card).join("")}${now}${next}</div><div class="tip" style="margin-bottom:12px">${ic("info")}<span>${h(H.说明)}</span></div>
   <div class="sub-h">第 ${r.圈} 圈（${h(r.运行日)}）出的 ${r.动作.length} 条动作${r.异常&&r.异常.length?`<span class="hint">当周异常：${r.异常.map(h).join("；")}</span>`:""}</div>${tb}`)}
/* ───────── ① 发现异常：抓到的数据 × 人定的目标 ───────── */
function kpiHtml(F){const W=F.逐周,Y=F.四周,I=F.库存,lab=W.map(w=>w.周),L=W.at(-1),Pv=W.at(-2),R=S.task.arrive_weeks,lv=k=>F.异常.find(a=>a.指标===k)?.级别||"good";
  const mc={critical:"--critical",serious:"--serious",warning:"--warning",good:"--accent"}[lv("库存够卖几周")];
  const T=(l,v,s,sp,lvl)=>`<div class="tile" style="--lc:${lvl&&lvl!=="good"?`var(${LC[lvl]})`:"transparent"}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div>${sp||""}</div>`;
  return `<div class="kpis">${T("上周销售额",usd(L.销售额),delta(L.销售额,Pv.销售额,true),spark(W.map(w=>w.销售额),usd,lab))}${T("上周广告费",usd(L.广告费),delta(L.广告费,Pv.广告费,false),spark(W.map(w=>w.广告费),usd,lab))}
  ${T("TACOS（四周）",pct(Y.TACOS),`${stat(lv("TACOS"))}<span>盈亏线 ${pct(Y.盈亏线)}</span>`,spark(W.map(w=>w.TACOS),v=>pct(v),lab),lv("TACOS"))}${T("SP 的 ACOS（近 14 天）",pct(F["SP-近14天"].ACOS),`${stat(lv("SP 的 ACOS"))}<span>目标 ${pct(S.task.target_acos,0)}</span>`,spark(W.map(w=>w.SP_ACOS),v=>pct(v),lab),lv("SP 的 ACOS"))}
  ${T("库存够卖",I.整体可售周数.toFixed(1)+" 周",`${stat(lv("库存够卖几周"))}<span>${R==null?"补货周数没填":"补货要 "+R+" 周"}</span>`,`<div class="meter" style="--mc:var(${mc})" title="可售周数 ÷ 到仓周数"><i style="width:${Math.min(100,I.整体可售周数/Math.max(R,.1)*100).toFixed(0)}%"></i></div>`,lv("库存够卖几周"))}${T("上周退款率",pct(L.退款率),`${stat(lv("退款率"))}${delta(L.退款率,Pv.退款率,false,true)}`,spark(W.map(w=>w.退款率),v=>pct(v),lab),lv("退款率"))}</div>`}
/* ───────── ②③④ 诊断树：异常 → 分析 → 诊断 → 动作 ───────── */
function graph(){const F=S.facts,T=S.tree,G={nodes:[],edges:[],by:{}};const add=(col,id,d)=>{const n={col,id,...d};G.nodes.push(n);G.by[id]=n};

  $("#roles").innerHTML=S.roles.map(r=>`<button class="${r===UI.who?"on":""}" onclick="setWho('${r}')">${h(r)}</button>`).join("");

/* ───────── 首页：今天要我处理什么 ───────── */
function todos(){if(!S.hasRun)return [];const t=S.task,out=[],days=daysLeft();
  if(t.status==="遇到问题"){const bad=(S.progress.steps||[]).find(s=>!s.ok);out.push({tag:"要你补",cls:"bad",t:"这一圈没跑成",d:bad?bad.detail:"缺输入或数据：补齐后重新跑一圈。上一份结果没被改动",pri:"P0",imp:"先处理",btn:"去补",on:"UI.goalOpen=true;go('home')",sort:-2})}
  else if(t.status==="待处理")out.push({tag:"待重跑",cls:"warn",t:"目标或取舍改过了，还没重跑",d:"点「跑一圈」，Agent 按新输入重出动作；你处理过的会保留，没点过的作废",pri:"P0",imp:"先处理",btn:"跑一圈",on:"runLoop()",sort:-1});
  S.options.forEach(o=>{const L=S.actions.filter(a=>a.item===o.key&&a.status==="待确认");if(!L.length)return;
    const lv=Math.min(3,...S.tree.分析.filter(x=>x.对策[0]===o.key).map(x=>SEV[(S.facts.异常.find(a=>a.指标===x.来自[0])||{}).级别||"good"]));   // 按这条对策的主要问题定优先级
    const cnt={};L.forEach(a=>cnt[a.type]=(cnt[a.type]||0)+1);const types=Object.entries(cnt).sort((a,b)=>b[1]-a[1]),sp=L.reduce((x,a)=>x+(a.spend||0),0);
    out.push({tag:"待你决定",cls:"",t:`${o.名称}：${L.length} 条动作`,d:types.map(([k,v])=>`${k} ${v}`).join(" · ")+"｜"+o.做什么,pri:"P"+lv,imp:sp?`近 14 天涉及 ${usd(sp)}`:"估算影响见详情",btn:"去决定",on:`goActions('待你决定','${jsq(types[0][0])}')`,sort:lv})});
  const rev=S.actions.filter(a=>a.note&&a.status==="已确认").length;
  if(rev)out.push({tag:"请复核",cls:"warn",t:`${rev} 条你通过过的动作，现在规则不再建议`,d:"输入变了。系统不替你撤：撤回，还是照做，你定",pri:"P1",imp:"防做错",btn:"去复核",on:"goActions('待执行')",sort:.5});
  const ex=S.actions.filter(a=>a.status==="已确认"&&!a.note).length;
  if(ex)out.push({tag:"待执行",cls:"good",t:`${ex} 条已通过，等人上传广告后台`,d:"按通道导出批量上传表；传完回来标「已执行」",pri:"",imp:"",btn:"去执行",on:"goActions('待执行')",sort:5});
  const done=S.actions.filter(a=>a.status==="已执行").length;
  if(done)out.push({tag:days<=0?"到期看结果":"等验证",cls:"muted",t:`${done} 条已执行，${days<=0?"到复盘日了":`${days} 天后看结果`}`,d:`复盘日 ${S.meta.复盘日}：重导一周数据再跑一圈，逐条对结果`,pri:"",imp:"",btn:"看结果",on:"goActions('等验证')",sort:days<=0?.2:9});
  return out.sort((a,b)=>a.sort-b.sort)}
function goalForm(){const t=S.task;return `<div class="goal">

function homePage(){const F=S.facts,m=S.meta,t=S.task,T=todos(),hr=new Date().getHours(),hi=hr>=5&&hr<11?"早上好":hr>=11&&hr<18?"下午好":"晚上好",concl=S.runs[0]&&S.runs[0].conclusion;

  <div class="card" id="todo"><h3>需要你处理的事</h3><div class="sub">按对生意的影响从大到小排</div>${todo}</div>

    <div class="r"><span class="bp">目标 ACOS <b>${t.target_acos==null?"—":pct(t.target_acos,0)}</b></span>${bizOK()?`<span class="bp">目标 TACOS <b>${nv(S.biz.算账.目标TACOS,pct)}</b></span>`:""}<span class="bp">补货到仓 <b>${t.arrive_weeks??"—"}</b> 周</span><span class="bp">${h(t.stage||"—")}</span><button class="btn" onclick="UI.goalOpen=!UI.goalOpen;render()">${UI.goalOpen?"收起":"改目标"}</button></div></div>
  ${UI.goalOpen?`<div class="card" id="goal"><h3>对照目标</h3><div class="sub">都由人定。上面三个改了要重跑；下面两个只重算经营核算，动作不变</div>${goalForm()}</div>`:""}
  <div id="kpi">${kpiHtml(F)}</div>
  <div class="card" id="concl"><h3>这周的结论</h3><div class="sub">数字由脚本算，对着上面的目标比</div>${concl?`<p class="concl">${h(concl)}</p>`:""}
    ${bad.map(arow).join("")}${ok.length?`<details class="more"><summary>另有 ${ok.length} 项正常</summary>${ok.map(arow).join("")}</details>`:""}</div>`}

/* ───────── 行动：列表 → 详情 ───────── */
function agroups(tab){const st=ATAB[tab],ver=S.task.version,g={};S.actions.filter(a=>a.status===st).forEach(a=>{const k=a.type+"|"+a.version;(g[k]=g[k]||{key:k,type:a.type,item:a.item,ver:a.version,cur:a.version===ver,list:[]}).list.push(a)});
  return Object.values(g).sort((a,b)=>(b.cur-a.cur)||a.item.localeCompare(b.item)||(b.list.length-a.list.length))}
function stepper(cur,L){return `<div class="stp">${L.map(([t,s],i)=>`<div class="stp-i ${i<cur?"done":i===cur?"now":""}"><i></i><b>${t}</b><small>${h(s||"")}</small></div>`).join("")}</div>`}
function actionDetail(g,tab){const o=S.options.find(x=>x.key===g.item)||{},ch=chOf(g.type),m=S.meta;
  const hs=S.tree.分析.filter(x=>x.对策.includes(g.item)&&x.判定!=="未触发"),xs=[...new Set(hs.flatMap(x=>x.来自))].map(n=>S.facts.异常.find(a=>a.指标===n)).filter(a=>a&&a.级别!=="good");
  const who_=(g.list.find(a=>a.by)||{}).by,cur={"待你决定":2,"待执行":3,"等验证":4,"已验证":5,"已驳回":2,"已作废":2}[tab],pend=g.list.filter(a=>a.status==="待确认").length,rev=g.list.filter(a=>a.note&&a.status==="已确认").length;
  const steps=[["发现",xs[0]?xs[0].指标:"对着目标比出来"],["分析",hs[0]?hs[0].判定:""],["决定",tab==="待你决定"?"等你拍板":tab==="已驳回"?"你驳回了":tab==="已作废"?"输入变了，已作废":`${who_||"人"}已通过`],["执行",ch.接通===false?"人上传后台":"运营直接定"],["验证",`${m.复盘日.slice(5)} 看结果`]];
  const sp=g.list.reduce((x,a)=>x+(a.spend||0),0),ex=tab==="待执行"||tab==="等验证"||tab==="已验证";

  if(tab==="待执行")bar=`<div class="abar"><a class="btn primary" href="/api/export.csv?status=已确认&types=${encodeURIComponent(g.type)}">${ic("dl")}导出这一类的${ch.id==="ads"?"批量上传表":"清单"}</a><span class="hint">${h(ch.通道)}${ch.接通===false?"还没接通":""}：${h(ch.现在怎么做||"")}。做完回来逐条标「已执行」。</span></div>`;
  if(tab==="等验证")bar=`<div class="abar"><span class="hint">到 ${h(m.复盘日)} 重导一周数据、再跑一圈；结果对得上的，逐条标「下周已验证」。</span></div>`;
  return `<div class="dcard" id="adetail"><div class="dhead"><div><span class="tg ${tab==="待你决定"?"":tab==="已驳回"?"bad":tab==="已作废"?"muted":"good"}">${tab}</span><h2>${h(g.type)}${g.cur?"":` <span class="vtag">上一版 v${g.ver}</span>`}</h2><div class="sub">${o.名称?`对策 ${h(o.key)}「${h(o.名称)}」 · `:""}交给 ${h(ch.通道)}</div></div><div class="big">${g.list.length}<small>条${sp?` · 涉及 ${usd(sp)}`:""}</small></div></div>
  ${stepper(cur,steps)}
  ${rev?`<div class="warnbox">${ic("info")}<span>输入已变，新输入下规则不再建议这里的 <b>${rev}</b> 条。系统不替你撤：逐条「撤回」，或者照做并标「已执行」。</span></div>`:""}
  ${o.做什么&&!rev?`<div class="dsec"><h4>建议怎么做 <span class="by">Agent 写</span></h4><div class="rec"><b>${h(o.做什么)}</b><p>代价：${h(o.代价)}</p></div>
    <details class="more"><summary>为什么这么建议</summary><ul class="whyl">${xs.map(a=>`<li><b>${h(a.指标)}</b>　${h(a.现值)}（对比：${h(a.参照)}）<small>${h(a.说明)}</small></li>`).join("")}${hs.map(x=>`<li>${h(x.结论)}<small>不成立的情况：${h(x.不成立)}</small></li>`).join("")}</ul>
    <button class="btn sm" style="margin-top:8px" onclick="goWhy('T:${jsq(g.item)}:${jsq(g.type)}')">看完整的原因链</button></details></div>
  <div class="dsec" id="q3"><h4>动手前的三问</h4><div class="q3"><div><span>为什么做</span><p>${xs[0]?`${h(xs[0].指标)} ${h(xs[0].现值)}（对比：${h(xs[0].参照)}）。${h(xs[0].说明||"")}`:h(o.做什么)}</p></div>
    <div><span>预期改变什么（怎么算成功）</span><p>${h(SUCCESS[g.item]||"对照行动卡第 9 格")}</p></div>
    <div><span>多久复盘</span><p>到 <b>${h(m.复盘日)}</b> 看${bizOK()&&S.biz.决策表.复盘时间?`；${h(S.biz.决策表.复盘时间)}`:""}。到期没做到，下一圈会重新起草。</p></div></div></div>`:""}
  ${bar}

const nv=(v,f)=>v==null?"—":f(v), pt=v=>(v<0?"−":"")+Math.abs(v*100).toFixed(1)+" 个点";
const BY={a:`<span class="by">Agent 写</span>`,s:`<span class="by s">脚本算</span>`,h:`<span class="by h">人定</span>`};
const bizOK=()=>!!(S.biz&&!S.biz.错误&&S.biz.算账), aiOK=()=>!!(S.ai&&S.ai.状态&&S.ai.状态!=="skipped"&&!S.ai.过期);
const fmtNode=(n,v)=>v==null?"—":/CPC|客单价/.test(n)?"$"+(+v).toFixed(2):pct(v);
const fmtAny=(k,v)=>v==null?"—":Array.isArray(v)?h(v.join("、")):typeof v!=="number"?h(v):/率|占|TACOS|ACOS|CVR|降幅|可降|影响/.test(k)?pct(v):/额|费|价|预算|利润|花|省/.test(k)?"$"+(v<100?(+v).toFixed(2).replace(/\.00$/,""):Math.round(v).toLocaleString("en-US")):(Math.round(v*10)/10).toLocaleString("en-US");
const JC={"在目标内":"good","超出目标":"warn","已亏损":"bad"}, NC={"正常":"","偏高":"warn","偏低":"warn"};

  const A=S.biz.算账,D=S.biz.拆解||{},L=D.核心限制||{},R=S.biz.路径||{},ai=aiOK()?S.ai:{},pa=ai.路径建议||{},cand=(R.候选||[]).find(x=>x.key===R.脚本建议);
  return `<div class="card" id="biz"><h3>先算账，再动手</h3><div class="sub">目标从利润倒推出来；数字由脚本算，标「Agent 写」的是模型读完数字后写的话</div><div class="biz3">

    ${ai.核心限制一句话?`<p class="aip">${BY.a}${h(ai.核心限制一句话)}</p>`:`<p>${h(L.规则||"")}</p>`}

    <p>${h(cand?cand.名:R.脚本建议==="先解决库存"?"库存撑不到补货到仓：先保住不断货，再谈放量和降耗":"")}</p>
    ${pa.选?`<p class="aip">${BY.a.replace("Agent 写","Agent 建议")}${R.脚本建议==="先解决库存"?"库存接上之后走":""}「${h(pa.选)}」：${h(String(pa.理由||"").split("。")[0])}。</p>`:""}
    <button class="btn sm" onclick="goBiz('paths')">看四条路径和决策表</button><p class="hint">走哪条由你定。</p></div>
  </div></div>`}
function bizPage(){if(!bizOK())return `<div class="card"><div class="alldone">${ic("info")}<span>这一圈还没有经营核算（${h((S.biz&&S.biz.错误)||"先跑一圈")}）。</span></div></div>`;
  const B=S.biz,D=B.拆解||{},L=D.核心限制||{},G=D.归因路径||{},R=B.路径||{},T=B.决策表||{},ai=aiOK()?S.ai:{},pa=ai.路径建议||{},dd=ai.决策表草稿||{};
  const nodes=(D.节点||[]).map((n,i)=>`<div class="nd ${NC[n.判定]||""} ${i===0?"root":""}"><span>${h(n.名)}</span><b>${fmtNode(n.名,n.值)}</b><small>${h(n.对比||"")}${n.变化?`${n.对比?" · ":""}周环比 ${h(n.变化)}`:""}</small>${n.判定&&n.判定!=="正常"?`<em>${h(n.判定)}</em>`:""}${n.缺?`<em class="miss" title="${h(n.缺)}">口径：${h(String(n.缺).split(/[；。，]/)[0])} ⓘ</em>`:""}</div>`).join("");

    ${p.测算&&Object.keys(p.测算).length?`<dl>${Object.entries(p.测算).filter(([k,v])=>!["口径","缺"].includes(k)&&v!=null&&(typeof v!=="object"||Array.isArray(v))).map(([k,v])=>`<div><dt>${h(k)}</dt><dd>${fmtAny(k,v)}</dd></div>`).join("")}</dl>${p.测算.口径?`<details class="more"><summary>怎么算的</summary><p class="hint">${h(p.测算.口径)}${p.测算.缺?`　缺：${h(p.测算.缺)}`:""}</p></details>`:""}`:""}${p.缺?`<p class="hint">缺：${h(p.缺)}</p>`:""}</div>`).join("");
  const rows=["当前状态","首要目标","核心限制","选择方向","执行方案","投入边界","验证标准","复盘时间","后续选择"].map(k=>`<tr><th>${k}</th><td>${k==="首要目标"?`${BY.h} `:""}${h(T[k]||"—")}</td><td>${dd[k]?h(dd[k]):`<span class="hint">—</span>`}</td></tr>`).join("");
  return `<div class="card" id="bz-tree"><h3>指标拆解</h3><div class="sub">${(D.公式||[]).map(h).join("　｜　")}${D.变化口径?`<br>${h(D.变化口径)}`:""}</div><div class="nds">${nodes}</div>

    ${G.步骤&&G.步骤.length?`<details class="more" open><summary>怎么一步步查到这里的（入口：${h(G.入口||"")}）</summary><ol class="steps">${G.步骤.map(x=>`<li>${h(x)}</li>`).join("")}</ol></details>`:""}</div>

      ${filled.map(([k,v])=>`<span class="chip ${v?"on":""}">${k}${typeof v==="number"&&v?` ${v}`:""}</span>`).join("")}<span style="flex:1"></span>${B({label:S.aiBusy||UI.aiBusy?"正在补位…":"重跑模型补位",icon:"refresh",cls:"sm",on:"aiFill()",perm:"模型补位"})}</div></div>
  <div class="card" id="wkd"><h3>周报草稿 ${useAi?BY.a:draft?BY.s.replace("脚本算","脚本按规则拼"):""}</h3><div class="sub">${!useAi&&W?h(W.文件)+" · ":""}只起草不发；你看过、点了才会发到群</div>
    ${draft?`<div class="mdv">${mdx(draft,false)}</div><div class="aifill">${B({label:"发到群",icon:"ext",cls:"sm primary",on:"sendGroup(null,'weekly')",perm:"发到群"})}<button class="btn sm" onclick="copyText(DRAFTS.weekly)">复制</button><span class="hint">发之前会再问你一次。</span></div>`:`<div class="alldone">${ic("info")}<span>还没有周报草稿。跑过一次每周一圈后会出现在这里。</span></div>`}</div>`}
function buildTab(){const J=S.jobcard||{},F=J.字段分工||{},sk=S.skills||[];
  return `<div class="card" id="hn"><h3>Harness：把它围起来的七样东西</h3><div class="sub">模型只是其中一环。触发、配方、上下文、工具、护栏、状态、评估，缺一样它就跑不稳</div>
    ${(S.harness||[]).map(x=>`<div class="hrow"><i class="${x.状态==="ok"?"":x.状态}"></i><b>${h(x.部件)}</b><div><p>${h(x.说明)}</p><small>${h(x.落在哪)}</small></div></div>`).join("")}</div>
  <div class="card" id="fd"><h3>谁写什么</h3><div class="sub">${h(J.原则||"数字归脚本，判断归模型，拍板归人")}。页面上每块内容都标了是谁写的</div>
    <div class="div3">${[["人写","h","人写"],["脚本写","s","脚本写"],["Agent 写","a","Agent 写"]].map(([t,k,key])=>`<div><h4>${BY[k].replace(/>.*</,">"+t+"<")}</h4><ul>${(F[key]||[]).map(x=>`<li>${h(x)}</li>`).join("")}</ul></div>`).join("")}</div>
    ${(J.它不做||[]).length?`<p class="hint" style="margin:12px 0 0"><b style="color:var(--ink)">它不做：</b>${J.它不做.map(h).join("；")}。</p>`:""}</div>
  <div class="card" id="skl"><h3>技能包</h3><div class="sub">${sk.length} 个技能，在仓库的 <code>skills/</code> 下；告诉模型每一步读什么、判断什么、写到哪。装进 Agent ${sk.filter(x=>x.已装进Agent).length} 个</div>
    ${sk.length?sk.map(x=>`<div class="sk"><b>${h(x.名)}</b><p>${h(x.说明)}</p><span class="tag ${x.已装进Agent?"on":"off"}">${x.已装进Agent?"已装":"未装"}</span></div>`).join(""):`<div class="alldone">${ic("info")}<span>仓里还没有技能包。</span></div>`}
    <p class="hint" style="margin:10px 0 0">装进 Hermes：<code>bash agent/install_hermes.sh</code>；装进 Claude Code 或 Codex：<code>bash skills/install.sh --target claude</code>。</p></div>`}
async function aiFill(){UI.aiBusy=true;render();try{const r=await api("/api/ai-fill",{});toast(r.ok?"模型补位完成："+(r.msg||""):"没补成："+(r.msg||""))}catch(e){}UI.aiBusy=false;await load()}

/* 设置：Agent 接通状态、口径 */
let HEALTH=null;
async function loadHealth(fresh){try{HEALTH=await (await fetch("/api/health"+(fresh?"?fresh=1":""))).json()}catch(e){HEALTH=null}askHead();if(UI.page==="settings"&&S)render()}
function healthCard(){const H=HEALTH;return `<div class="card" id="set-agent"><h3>Agent 接通状态</h3><div class="sub">每周一圈不依赖这里；这里管的是「页面里能不能问它」</div>
  ${H?H.项.map((x,i)=>`<div class="hrow w"><i class="${x.ok?"":(i===4&&H.走哪条==="hermes")?"sk":"off"}"></i><b>${h(x.名)}</b><div><p>${h(x.说明)}</p>${x.怎么修?`<small>怎么修：${h(x.怎么修)}</small>`:""}</div></div>`).join("")+`<p class="hint" style="margin:10px 0 0">${H.可问?`现在问 Agent 走的是：<b style="color:var(--ink)">${H.走哪条==="hermes"?`Hermes 上的「${h(H.profile)}」（能读文件、能用技能）`:"直连模型（只看得到这一圈脚本算好的要点）"}</b>。`:"现在页面里问不了它。上面红的那一项修好就行。"}　<a href="javascript:void 0" style="color:var(--accent)" onclick="loadHealth(true)">重新检查</a></p>`:`<div class="alldone">${ic("info")}<span>正在检查…</span></div>`}</div>`}
function koujingCard(){const K=S.koujing;if(!K)return "";const note=K.说明||{},nt=(g,k)=>typeof note[g]==="object"&&note[g]?note[g][k]:(note[k]||note[g+"."+k]||"");
  const rows=Object.entries(K).filter(([g,v])=>g!=="说明"&&v&&typeof v==="object").map(([g,v])=>Object.entries(v).map(([k,x],i)=>`<tr>${i===0?`<th rowspan="${Object.keys(v).length}" style="vertical-align:top;background:var(--surface2)">${h(g)}</th>`:""}<td>${h(k)}</td><td class="num">${h(typeof x==="object"?JSON.stringify(x):x)}</td><td class="sub2">${h(nt(g,k))}</td></tr>`).join("")).join("");
  return `<div class="card" id="set-kj"><h3>口径（阈值与调幅）</h3><div class="sub">全仓唯一来源：<code>口径.json</code>。流水线读它，技能包引用它；改这个文件，再跑一圈</div><div class="tw" style="max-height:420px;overflow:auto"><table><thead><tr><th>分组</th><th>口径</th><th class="num">值</th><th>含义</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}

/* 问 Agent */
const ASK={msgs:[],busy:false}, DRAFTS={}, SENT={};
function mdx(s,drafts=true){const parts=String(s||"").split(/```/);let out="";
  parts.forEach((p,i)=>{if(i%2){const nl=p.indexOf("\n"),lang=(nl<0?p:p.slice(0,nl)).trim(),body=(nl<0?"":p.slice(nl+1)).replace(/\s+$/,"");
      if(lang==="群消息"&&drafts){const id="d"+Object.keys(DRAFTS).length;DRAFTS[id]=body;out+=`<div class="draft" id="${id}"><div class="dh">${ic("ext")}群消息草稿</div><div class="db2">${h(body)}</div><div class="df">${SENT[body]?`<span class="tg good">${h(SENT[body])}</span>`:`<button class="btn sm primary" onclick="sendGroup('${id}')">发到群</button><button class="btn sm" onclick="copyText(DRAFTS['${id}'])">复制</button><span class="hint">点了才会发；发之前再问你一次</span>`}</div></div>`}
      else out+=`<pre>${h(nl<0?p:body)}</pre>`;return}
    let ul=false;p.split("\n").forEach(line=>{const t=line.trim(),li=/^([-*•]|\d+[.、])\s+/.test(t);if(ul&&!li){out+="</ul>";ul=false}
      if(!t)return;const inl=md(t.replace(/^([-*•]|\d+[.、])\s+/,"").replace(/^#{1,6}\s*/,""));
      if(/^#{1,6}\s/.test(t))out+=`<h5>${inl}</h5>`;else if(t[0]===">")out+=`<p class="hint">${md(t.replace(/^>\s*/,""))}</p>`;else if(li){if(!ul){out+="<ul>";ul=true}out+=`<li>${inl}</li>`}else out+=`<p>${inl}</p>`});if(ul)out+="</ul>"});return out}
function askCtx(){const n=PAGES.find(p=>p[0]===UI.page)[2];if(UI.page==="actions")return `行动 · ${UI.atab||"待你决定"}${UI.agrp?" · "+String(UI.agrp).split("|")[0]:""}`;if(UI.page==="campaigns"&&UI.camp)return `广告活动 · ${UI.camp}（${cn(UI.camp)}）`;if(UI.page==="why")return `原因 · ${UI.whyTab==="tree"?"问题连线":"经营拆解"}`;return n}
function askSugs(){const J=S.jobcard||{},g=String(UI.agrp||"").split("|")[0];
  return ({home:["这周最该管的一件事是什么？依据呢？","目标 TACOS 是怎么算出来的，现在还有多少余量？","把这周的结论写成群消息"],
    actions:[g?`「${g}」这类动作为什么这么建议？`:"这一圈哪类动作最要紧？","哪几条风险最大，值得再想想？","这些动作通过后预期改变什么、多久复盘？"],
    campaigns:[UI.camp?`「${UI.camp}」这条广告的任务完成了吗？`:"哪些广告没完成它的任务？","哪些是纯利型广告？为什么？","预算吃紧的是哪几个？"],
    why:["现在卡在哪个指标上？为什么不是别的？","四条利润路径为什么建议这一条？","帮我把决策表的执行方案写具体"],
    agent:["这周自动跑了没？结果怎样？","上一圈我驳回了什么，这一圈怎么处理的？"],settings:["目标广告后利润率我该怎么定？"]})[UI.page]||J.你可以问它||[]}
function askHead(){const el=document.getElementById("askst");if(!el)return;const H=HEALTH,on=!!(H&&H.可问);document.querySelectorAll("#askfab i,#askdot").forEach(x=>x.classList.toggle("on",on));
  el.textContent=!H?"检查中…":H.可问?(H.走哪条==="hermes"?`已接通 · Hermes「${H.profile}」`:"已接通 · 直连模型"):"未接通（设置里看怎么接）";document.getElementById("askname").textContent=(H&&H.名字)||"广告 Agent"}
function askRender(){const box=document.getElementById("askmsgs");if(!box)return;
  box.innerHTML=ASK.msgs.length?ASK.msgs.map((m,i)=>m.role==="user"?`<div class="msg u">${h(m.content)}</div>`:m.err?`<div class="msg err">${h(m.content)}</div>`:`<div class="msg a" id="am${i}">${(m.tools||[]).map(t=>`<div class="tool">· ${h(t)}</div>`).join("")}${mdx(m.content)||(ASK.busy&&i===ASK.msgs.length-1?`<span class="hint">在想…</span>`:"")}</div>`).join("")
    :`<div class="hint" style="padding:6px 2px">它读的是这一圈脚本算好的数字和经营核算，回答会说明出处。它不审批、不改目标、不发消息：要发群，它只给草稿，你点了才发。</div>`;
  box.scrollTop=box.scrollHeight;document.getElementById("asksug").innerHTML=ASK.busy?"":askSugs().map(q=>`<button onclick="ask('${jsq(q)}')">${h(q)}</button>`).join("");
  document.getElementById("askctx").textContent="它知道你在看："+askCtx();document.getElementById("asksend").disabled=ASK.busy}
function askOpen(on){document.body.classList.toggle("askopen",on);if(on){if(!HEALTH)loadHealth();askHead();askRender();setTimeout(()=>document.getElementById("askin")?.focus(),40)}}
async function ask(q){q=(q??document.getElementById("askin").value).trim();if(!q||ASK.busy)return;document.getElementById("askin").value="";
  ASK.msgs.push({role:"user",content:q});const a={role:"assistant",content:"",tools:[]};ASK.msgs.push(a);ASK.busy=true;askRender();
  try{const r=await fetch("/api/agent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({who:who(),context:askCtx(),messages:ASK.msgs.slice(0,-1).filter(m=>!m.err).map(m=>({role:m.role,content:m.content}))})});
    if(!r.ok){const j=await r.json().catch(()=>({}));a.err=true;a.content=j.error||("出错了："+r.status);loadHealth(true)}
    else{const rd=r.body.getReader(),dec=new TextDecoder();let buf="",evt="";
      for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
        while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).replace(/\r$/,"");buf=buf.slice(i+1);
          if(line.startsWith("event:")){evt=line.slice(6).trim();continue}if(!line.startsWith("data:")){if(!line)evt="";continue}
          const d=line.slice(5).trim();if(d==="[DONE]")continue;let j;try{j=JSON.parse(d)}catch(e){continue}
          if(evt&&evt.includes("tool")){if(j.status&&j.status!=="running")continue;const t=[j.tool||j.name||"",j.label||j.preview||""].filter(Boolean).join(" · ");if(t&&a.tools.at(-1)!==t)a.tools.push(String(t).slice(0,80))}
          else{const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c)a.content+=c}
          askRender()}}
      if(!a.content){a.err=true;a.content="它没有回话。再问一次，或到「设置」看接通状态。"}}}
  catch(e){a.err=true;a.content="连不上工作台后端："+e.message}
  ASK.busy=false;askRender()}
function copyText(t){navigator.clipboard?.writeText(t||"").then(()=>toast("已复制"),()=>modal("复制不了：浏览器没给剪贴板权限"))}
async function sendGroup(id,key){const text=key==="weekly"?DRAFTS.weekly:DRAFTS[id];if(!text)return;if(!confirm("把这段发到群里？发出去就撤不回了。\n\n"+text.slice(0,200)+(text.length>200?"…":"")))return;
  try{const r=await api("/api/post-to-group",{text,confirm:true});SENT[text]=`已发到「${r.group}」 ${r.at}`;toast(SENT[text]);askRender();load()}catch(e){}}

/* ───────── 动作 ───────── */
async function load(){S=await api("/api/state");render()}
async function act(no,status,reason){try{await api("/api/action/"+encodeURIComponent(no),{status,reason});UI.rejecting=null;await load()}catch(e){}}
async function bulk(type){try{const r=await api("/api/bulk",{type});toast(`已通过 ${r.n} 条，在「待执行」里导出`);await load()}catch(e){}}
async function saveInputs(){const a=$("#in_acos").value,w=$("#in_weeks").value,mg=$("#in_margin").value,pf=$("#in_profit").value;try{const r=await api("/api/inputs",{target_acos:a===""?"":a/100,arrive_weeks:w,stage:$("#in_stage").value,margin:mg===""?"":mg/100,target_profit:pf===""?"":pf/100});
  toast(r.changed.length?"目标已保存。点「跑一圈」按新目标重出动作":(r.biz||[]).length?"经营口径已保存，目标 TACOS 和单品预算已重算；动作不变":"目标没有变化");UI.goalOpen=false;await load()}catch(e){}}
async function retrigger(){try{await api("/api/inputs",{retrigger:true});toast("已重新触发（目标没动）。点「跑一圈」看它会不会重复跑");await load()}catch(e){}}
async function saveOpts(){try{await api("/api/inputs",{options:[...UI.opts]});UI.opts=null;toast("对策已改。点「跑一圈」重出动作");await load()}catch(e){UI.opts=null;render()}}
async function resetAll(){if(!confirm("重置：清空工作台的状态库，回到还没跑过的样子。确定？"))return;try{await api("/api/reset",{});UI.opts=null;UI.sel=null;UI.agrp=null;UI.camp=null;toast("已重置");await load();go("home")}catch(e){}}
async function runLoop(){try{await api("/api/run",{trigger:S.hasRun?"改输入重跑":"手动"})}catch(e){return}UI.playing=true;UI.shown=0;UI.cur=1;UI.openSteps.clear();if(isDemo())[1,2,3,4,5,6].forEach(i=>UI.openSteps.add(i));
  UI.agTab="这一圈";if(UI.page!=="agent")location.hash="agent";render();scrollTo(0,0);
  const tick=async()=>{const p=await (await fetch("/api/progress")).json();S.progress=p;if(UI.shown<p.steps.length){UI.shown++;const nx=p.steps[UI.shown];UI.cur=nx?nx.i:(p.running?Math.min(6,(p.steps.at(-1)?.i||0)+1):0);render();return setTimeout(tick,isDemo()?1400:650)}
    if(p.running){UI.cur=Math.min(6,(p.steps.at(-1)?.i||0)+1);render();return setTimeout(tick,350)}UI.playing=false;UI.cur=0;UI.opts=null;UI.sel=null;UI.agrp=null;await load();const ok=p.steps.every(s=>s.ok);
    toast(ok?"这一圈跑完了，停下来等你。首页有要你处理的事":"这一圈停下了：看红色那一格，首页有要你补的");if(!isDemo())setTimeout(()=>{if(UI.page==="agent"&&!UI.playing)go("home")},1500)};setTimeout(tick,300)}
$("#run").onclick=runLoop;
const Q=new URLSearchParams(location.search);if(Q.get("sel"))UI.sel=Q.get("sel");if(Q.get("hk"))UI.hk=+Q.get("hk");if(Q.get("tab"))UI.atab=Q.get("tab");if(Q.get("grp"))UI.agrp=Q.get("grp");if(Q.get("camp"))UI.camp=Q.get("camp");if(Q.get("goal"))UI.goalOpen=true;if(Q.get("wtab"))UI.whyTab=Q.get("wtab");if(Q.get("agtab"))UI.agTab=Q.get("agtab");
const MAXR=+Q.get("rows")||0;   // 截图用：明细表只留前几行
const ONLY=Q.get("only")?Q.get("only").split(","):null;   // 截图用：?shot=1 隐藏侧栏顶栏；?only=todo,band 只留这些块
function shotMode(){if(!ONLY&&!Q.get("shot"))return;document.body.classList.add("shot");if(ONLY)document.querySelectorAll("#app > *").forEach(el=>{el.style.display=ONLY.includes(el.id)?"":"none"})}
(async()=>{S=await (await fetch("/api/state")).json();
  try{const w=localStorage.getItem("who");if(w&&S.roles.includes(w))UI.who=w}catch(e){}
  let dm=Q.get("demo")==="1";try{dm=dm||localStorage.getItem("demo")==="1"}catch(e){}document.body.classList.toggle("demo",dm);render();loadHealth().then(()=>{if(Q.get("ask")||Q.get("askq"))askOpen(true);if(Q.get("askq"))ask(Q.get("askq"))})})();
