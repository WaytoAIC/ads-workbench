<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>广告周检工作台</title>
<style>
:root{--page:#f3f4f6;--surface:#fff;--surface2:#f8f9fb;--ink:#111318;--ink2:#4b5162;--muted:#8a909d;--line:#e3e5ea;--line2:#eef0f3;--axis:#c8ccd4;
--accent:#2a6fdb;--accent-h:#1f5fc4;--accent-soft:#e9f1fd;--accent-ink:#1a4c99;
--good:#12a150;--good-soft:#e6f6ed;--warning:#f0a817;--warn-soft:#fdf5e2;--serious:#ec835a;--critical:#d63a3a;--crit-soft:#fcebeb;--up-good:#0d7a3c;
--st-ok:#2a6fdb;--st-rej:#e0602e;--st-done:#15a374;--st-ver:#d99a00;--st-wait:#8a909d;--st-void:#c8ccd4;
--side:#151820;--side2:#1e222c;--side-ink:#eceef2;--side-muted:#8d94a3;--side-line:#272c37;
--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--shadow-lg:0 16px 40px rgba(16,24,40,.18);--ring:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0d0e11;--surface:#16181d;--surface2:#1b1e24;--ink:#f1f2f4;--ink2:#b3b8c3;--muted:#7c8391;--line:#2a2e37;--line2:#21242b;--axis:#3a3f4a;
--accent:#3d84ea;--accent-h:#5a97ee;--accent-soft:#15243a;--accent-ink:#9cc2f6;--good-soft:#10291b;--warn-soft:#2c2412;--crit-soft:#331818;--up-good:#2fc06d;--st-ok:#3d84ea;--st-void:#3a3f4a;
--side:#0a0b0e;--side2:#15171c;--side-line:#1f232b;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:14.5px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── 外壳：侧栏 + 主区 ── */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 14px;gap:18px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}.logo .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3d84ea,#1f5fc4);display:flex;align-items:center;justify-content:center;flex:none}
.logo .mk svg{stroke:#fff;width:19px;height:19px}.logo b{display:block;font-size:15px;line-height:1.25}.logo small{display:block;color:var(--side-muted);font-size:11.5px;letter-spacing:.04em}
.tcard{background:var(--side2);border:1px solid var(--side-line);border-radius:10px;padding:11px 12px;font-size:12.5px}
.tcard .r{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--side-muted)}.tcard .r+.r{margin-top:6px}.tcard b{color:var(--side-ink);font-weight:600}
.tcard .id{font-size:14px;font-weight:600;color:var(--side-ink)}
.glabel{font-size:11px;letter-spacing:.08em;color:var(--side-muted);padding:0 10px;margin-bottom:6px;text-transform:uppercase}
.snav{display:flex;flex-direction:column;gap:2px}
.snav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-muted);text-decoration:none;font-size:13.5px;transition:background .15s,color .15s;white-space:nowrap}
.snav a:hover{background:var(--side2);color:var(--side-ink)}.snav a.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:#fff}.snav a.on svg{stroke:#8db8f5}
.snav .sn{width:18px;height:18px;border-radius:5px;border:1.5px solid currentColor;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}.snav a.on .sn{border-color:#8db8f5;color:#8db8f5}
.snav .ct{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;background:var(--side-line);color:var(--side-ink)}
.snav .ct.hot{background:var(--critical);color:#fff}.snav .ct.warn{background:var(--warning);color:#1b1300}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--side-line);padding-top:14px}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--side-ink);cursor:pointer;padding:0 6px}.sw input{display:none}
.sw .tr{width:34px;height:20px;border-radius:999px;background:var(--side-line);position:relative;transition:background .2s;flex:none}.sw .tr:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.tr{background:var(--accent)}.sw input:checked+.tr:after{transform:translateX(14px)}.sw small{display:block;color:var(--side-muted);font-size:11.5px}
.dmark{font-size:11.5px;color:var(--side-muted);padding:0 6px;line-height:1.5}

/* ── 顶栏 ── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1360px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ttl{flex:1 1 260px;min-width:0}.ttl .crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}.ttl h1{margin:1px 0 0;font-size:18px;line-height:1.3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ttl .meta{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 11px;font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.seg .n{font-size:11.5px;color:var(--muted);font-weight:500}.seg button.on .n{color:var(--accent)}
.flabel{font-size:12px;color:var(--muted);margin-right:-6px}
.spill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.spill i{width:8px;height:8px;border-radius:50%;background:var(--c)}.spill.live i{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.3}}
.vtag{font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}

/* ── 按钮体系 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s,color .15s;position:relative}
.btn:hover{border-color:var(--axis);background:var(--surface2)}.btn:focus-visible{outline:0;box-shadow:var(--ring)}.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(31,95,196,.3)}.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.lg{height:40px;padding:0 20px;font-size:14.5px;border-radius:9px}.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px;gap:5px}.btn.sm svg.i{width:14px;height:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.success{background:var(--good);border-color:var(--good);color:#fff;font-weight:600}.btn.success:hover{filter:brightness(.94)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}.btn.soft:hover{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.btn.danger{border-color:color-mix(in srgb,var(--critical) 45%,var(--line));color:var(--critical)}.btn.danger:hover{background:var(--crit-soft);border-color:var(--critical)}
.btn.danger.solid{background:var(--critical);border-color:var(--critical);color:#fff}
.btn.locked{opacity:.62}.btn.locked .lk{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--ink2);display:flex;align-items:center;justify-content:center}.btn.locked .lk svg{width:10px;height:10px;stroke:var(--surface);stroke-width:2.4}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.tsep{width:1px;height:24px;background:var(--line)}

/* ── 主区与面板 ── */
main{max-width:1360px;margin:0 auto;padding:22px 28px 90px}
section{scroll-margin-top:84px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line2)}
.ph .no{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.ph .no svg{stroke:var(--accent-ink)}.ph h2{margin:0;font-size:16.5px;line-height:1.3}.ph .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.ph .tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pb{padding:18px 20px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--line2)}.toolbar .r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub-h{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:8px}.sub-h .hint{font-weight:400}
.box{border:1px solid var(--line);border-radius:11px;background:var(--surface);min-width:0}.box .bh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:13px;font-weight:600}.box .bh .r{margin-left:auto;font-weight:400}.box .bb{padding:12px 14px}
.hint{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:16px}
code{background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:0 5px;font-size:12.5px}

/* 结论横幅 */
.banner{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(90deg,var(--warn-soft),var(--surface) 75%);border:1px solid color-mix(in srgb,var(--warning) 40%,var(--line));border-radius:14px;padding:14px 18px;margin:0 0 18px;font-size:15px}
.banner .ic{width:34px;height:34px;border-radius:9px;background:var(--warning);display:flex;align-items:center;justify-content:center;flex:none}.banner .ic svg{stroke:#1b1300}
.banner .k{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.04em;margin-bottom:2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px 11px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lc,transparent)}
.tile .l{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .v{font-size:25px;font-weight:650;line-height:1.2;margin:4px 0 3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{font-weight:600}.delta.good{color:var(--up-good)}.delta.bad{color:var(--critical)}.spark{display:block;margin-top:8px;width:100%;height:28px}
.meter{height:7px;border-radius:4px;margin-top:12px;overflow:hidden;background:color-mix(in srgb,var(--mc) 18%,var(--surface))}.meter i{display:block;height:100%;border-radius:4px;background:var(--mc)}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink);white-space:nowrap;font-weight:500}.stat svg{flex:none}

/* Loop 六动作 */
.loop{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;counter-reset:s}
.lstep{position:relative;border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-height:84px;background:var(--surface2);cursor:pointer;transition:border-color .2s,background .2s,box-shadow .2s}
.lstep:hover{border-color:var(--axis)}
.lstep:not(:last-child):after{content:"";position:absolute;right:-12px;top:22px;width:12px;height:2px;background:var(--line)}
.lstep.done:not(:last-child):after{background:var(--accent)}
.lstep .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}.lstep .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--axis);color:var(--ink2);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--surface)}
.lstep .d{font-size:12.5px;color:var(--ink2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.lstep.open .d{-webkit-line-clamp:unset}
.lstep ul{margin:6px 0 0 16px;padding:0;font-size:12px;color:var(--ink2);display:none}.lstep.open ul{display:block}
.lstep.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--surface)}.lstep.done .k{background:var(--accent);border-color:var(--accent);color:#fff}
.lstep.fail{border-color:var(--critical);background:var(--crit-soft)}.lstep.fail .k{background:var(--critical);border-color:var(--critical);color:#fff}
.lstep.now{background:var(--accent-soft);border-color:var(--accent);box-shadow:var(--ring)}.lstep.now .k{animation:pulse 1s infinite;border-color:var(--accent);color:var(--accent)}@keyframes pulse{50%{transform:scale(1.18)}}

/* 表格 */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--line2);padding:8px 12px;text-align:left;vertical-align:top}
thead th{background:var(--surface2);color:var(--ink2);font-weight:600;font-size:12px;white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.an td:first-child{white-space:nowrap}.an b{font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--ink2)}

/* 输入表单 */
.form{display:grid;gap:12px}.fld{display:grid;gap:5px}.fld>span{font-size:12.5px;color:var(--ink2);font-weight:500;display:flex;justify-content:space-between}.fld>span em{font-style:normal;color:var(--muted);font-weight:400;font-size:11.5px}
.ipt{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;transition:border-color .15s,box-shadow .15s}.ipt:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.ipt input,.ipt select{flex:1;min-width:0;border:0;background:transparent;padding:7px 10px;outline:0}.ipt .u{padding:0 10px;color:var(--muted);font-size:12.5px;border-left:1px solid var(--line2);align-self:stretch;display:flex;align-items:center;background:var(--surface2)}
.frow{display:flex;gap:8px;flex-wrap:wrap}.tip{display:flex;gap:8px;align-items:flex-start;background:var(--surface2);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--ink2)}.tip svg{stroke:var(--accent);margin-top:2px}

/* 证据三栏 */
.evi{border:1px solid var(--line);border-radius:11px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.evi .eh{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line2);background:color-mix(in srgb,var(--c) 9%,var(--surface))}.evi .eh i{width:8px;height:8px;border-radius:2px;background:var(--c)}.evi .eh small{font-weight:400;color:var(--muted);font-size:11.5px}
.evi ol,.evi ul{margin:0;padding:12px 14px 6px 32px;font-size:13px}.evi li{margin:0 0 8px}.evi li b{font-weight:600}
.utabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 12px;overflow-x:auto}.utab{border:0;background:transparent;padding:8px 12px;font-size:13.5px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.utab:hover{color:var(--ink)}.utab.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}

/* 取舍选项 */
.opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface);transition:border-color .15s,box-shadow .15s,background .15s}
.opt:hover{border-color:var(--axis);box-shadow:var(--shadow)}.opt.on{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.opt .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}.opt .key{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--axis);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none;background:var(--surface)}
.opt.on .key{background:var(--accent);border-color:var(--accent);color:#fff}.opt .ck{margin-left:auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--axis);display:flex;align-items:center;justify-content:center;flex:none}.opt.on .ck{background:var(--accent);border-color:var(--accent)}.opt .ck svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0}.opt.on .ck svg{opacity:1}
.opt p{margin:0;font-size:12.5px;color:var(--ink2)}.opt .c{font-size:12.5px;color:var(--ink);background:var(--warn-soft);border-radius:7px;padding:7px 9px}.opt .m{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);padding:0 8px;font-size:11.5px;color:var(--ink2);white-space:nowrap;font-weight:500;line-height:20px}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}.chip.warn{background:var(--warn-soft);border-color:transparent;color:#8a5a00}

/* 动作清单 */
.sbar{display:flex;gap:2px;height:10px;margin:0 0 8px;border-radius:5px;overflow:hidden}.sbar i{display:block;height:100%;min-width:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:6px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}.legend b{color:var(--ink)}
.grp{border:1px solid var(--line);border-radius:11px;margin-top:12px;overflow:hidden;background:var(--surface)}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);font-weight:600;font-size:14px}.grp>summary::-webkit-details-marker{display:none}
.grp>summary .chev{transition:transform .2s;stroke:var(--muted)}.grp[open]>summary .chev{transform:rotate(90deg)}.grp[open]>summary{border-bottom:1px solid var(--line)}
.grp .sp{margin-left:auto;display:flex;gap:8px;align-items:center;font-weight:400}.grp table th{background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;border-radius:999px;padding:1px 9px 1px 7px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink)}.badge i{width:7px;height:7px;border-radius:50%;background:var(--c)}

function s1(F){const t=S.task,n=F.异常.filter(a=>a.级别!=="good").length,A=S.tree.分析;

/* ───────── ②③④ 诊断树：异常 → 分析 → 诊断 → 动作 ───────── */
function graph(){const F=S.facts,T=S.tree,G={nodes:[],edges:[],by:{}};const add=(col,id,d)=>{const n={col,id,...d};G.nodes.push(n);G.by[id]=n};
  F.异常.forEach(a=>add(0,"X:"+a.指标,{k:"X",a}));
  T.分析.forEach(x=>{add(1,"H:"+x.id,{k:"H",x});x.来自.forEach(n=>G.by["X:"+n]&&G.edges.push(["X:"+n,"H:"+x.id]));});
  S.options.forEach(o=>{add(2,"O:"+o.key,{k:"O",o,d:T.诊断.find(d=>d.key===o.key)||{分析:[],数据源:[]}})});
  T.分析.forEach(x=>x.对策.forEach(k=>G.by["O:"+k]&&G.edges.push(["H:"+x.id,"O:"+k])));
  const grp={};curActs().forEach(a=>{const id=`T:${a.item}:${a.type}`;(grp[id]=grp[id]||{item:a.item,type:a.type,list:[]}).list.push(a)});
  Object.entries(grp).sort((a,b)=>a[1].item.localeCompare(b[1].item)).forEach(([id,g])=>{add(3,id,{k:"T",...g});G.by["O:"+g.item]&&G.edges.push(["O:"+g.item,id])});
  return G}
function pathOf(G,id){const set=new Set([id]);const walk=(cur,fw)=>G.edges.forEach(([a,b])=>{const [f,t]=fw?[a,b]:[b,a];if(f===cur&&!set.has(t)){set.add(t);walk(t,fw)}});walk(id,true);walk(id,false);return set}
function defaultSel(){const F=S.facts,a=F.异常.find(x=>x.级别==="critical")||F.异常.find(x=>x.级别!=="good")||F.异常[0];return "X:"+a.指标}
function chOf(type){return S.tree.通道.find(c=>c.类型.includes(type))||{通道:"人工判断",id:"human"}}
function nodeHtml(n,G,path){const on=UI.sel===n.id,inp=path.has(n.id),cls=`node ${on?"on":""} ${inp&&!on?"inpath":""} ${!inp?"faint":""}`;
  if(n.k==="X"){const a=n.a;return `<div class="${cls}${a.级别==="good"?" off":""}" data-id="${h(n.id)}" onclick="pickNode('${jsq(n.id)}')"><div class="t">${ICON[a.级别]}<span>${h(a.指标)}</span></div><div class="r"><span class="v">${h(a.现值)}</span><span>vs ${h(a.参照)}</span></div></div>`}
  if(n.k==="H"){const x=n.x;return `<div class="${cls}${x.判定==="未触发"?" off":""}" data-id="${h(n.id)}" onclick="pickNode('${jsq(n.id)}')"><div class="t"><span class="hid">${x.id}</span><span>${h(x.问题)}</span></div><div class="r">${vd(x.判定)}<span>${x.数据源.length} 个数据源</span></div></div>`}
  if(n.k==="O"){const o=n.o,sel=UI.opts.has(o.key);return `<div class="${cls}${sel?" sel":" off"}" data-id="${h(n.id)}" onclick="pickNode('${jsq(n.id)}')"><div class="t"><span class="key">${o.key}</span><span>${h(o.名称)}</span><span class="ck" title="选进本轮" onclick="event.stopPropagation();pick('${o.key}')">${ic("check")}</span></div><div class="r"><span>综合 ${n.d.数据源.length} 个数据源</span><span>·</span><span>${o.已选?`本轮 ${o.动作条数} 条`:"本轮没选"}</span></div></div>`}
  const pend=n.list.filter(a=>a.status==="待确认").length;return `<div class="${cls}" data-id="${h(n.id)}" onclick="pickNode('${jsq(n.id)}')"><div class="t"><span>${h(n.type)}</span><span class="v" style="margin-left:auto">${n.list.length}</span></div><div class="r"><span class="chn">${h(chOf(n.type).通道)}</span>${pend?`<span class="chip warn" style="line-height:17px">${pend} 待审批</span>`:`<span>已处理</span>`}</div></div>`}
function treeHtml(){const G=graph();if(!UI.sel||!G.by[UI.sel])UI.sel=defaultSel();const path=pathOf(G,UI.sel);
  const H=[["异常","对着目标比出来的"],["分析","一个异常可拆成多个问题，一个问题也可来自多个异常"],["诊断","综合多方数据下结论，定对策（人取舍）"],["输出动作","按对策生成，分类后进审批"]];
  const cols=[0,1,2,3].map(c=>`<div class="tcol"><div class="tch"><span class="st">${c+1}</span><b>${H[c][0]}</b><small>${H[c][1]}</small></div>${G.nodes.filter(n=>n.col===c).map(n=>nodeHtml(n,G,path)).join("")||`<p class="hint">本轮没有生成动作</p>`}</div>`).join("");
  const changed=[...UI.opts].sort().join()!==[...S.task.options].sort().join();
  const tools=changed?`<span class="hint">取舍改成 <b style="color:var(--ink)">${[...UI.opts].sort().join(" · ")||"无"}</b></span>${B({label:"按这个取舍重新生成",icon:"refresh",cls:"primary sm",on:"saveOpts()",perm:"改取舍"})}${B({label:"放弃",cls:"ghost sm",on:"UI.opts=null;render()"})}`:`<span class="chip">对策打勾＝选进本轮 · 只有老板能改</span>`;
  const miss=S.tree.未知.length?`<div class="miss">${ic("help")}<div><b style="color:var(--ink)">分析时还缺的数据（缺什么、去哪取）</b><ul>${S.tree.未知.map(x=>`<li>${md(x)}</li>`).join("")}</ul></div></div>`:"";
  return `<section class="panel" id="tree"><div class="ph"><span class="no">${ic("tree")}</span><div><h2>分析 → 诊断 → 输出动作</h2><div class="sub">点任意一个节点，看它从哪个异常来、用了哪些数据、最后落成哪些动作</div></div><div class="tools">${tools}</div></div>
  <div class="pb"><div class="tree" id="tree-g"><svg id="edges"></svg>${cols}</div>${detailHtml(G)}${miss}</div></section>`}
function drawEdges(){const g=document.getElementById("tree-g"),svg=document.getElementById("edges");if(!g||!svg)return;const G=graph(),path=pathOf(G,UI.sel),R=g.getBoundingClientRect();
  const el={};g.querySelectorAll(".node").forEach(n=>el[n.dataset.id]=n);
  svg.innerHTML=G.edges.map(([a,b])=>{const A=el[a],Bn=el[b];if(!A||!Bn)return "";const ra=A.getBoundingClientRect(),rb=Bn.getBoundingClientRect();
    const x1=ra.right-R.left,y1=ra.top+ra.height/2-R.top,x2=rb.left-R.left,y2=rb.top+rb.height/2-R.top,dx=(x2-x1)/2,hot=path.has(a)&&path.has(b);
    return `<path class="${hot?"hot":"faint"}" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}"/>`}).join("")}
addEventListener("resize",()=>requestAnimationFrame(drawEdges));

/* ───────── 广告字段单元格 ───────── */
function campCell(a){const f=a.f||{};if(!f.Campaign)return `<span class="hint">${h(a.campaign)}</span>`;
  return `<div class="cn">${h(f.Campaign)}</div>${f.广告组?`<div class="sub2">广告组 <span class="cn" style="font-weight:500">${h(f.广告组)}</span></div>`:""}<div class="idl">${f["Campaign ID"]?`ID ${h(f["Campaign ID"])}`:""}${f.涉及活动&&f.涉及活动.length>1?` · 另 ${f.涉及活动.length-1} 个活动`:""}</div>`}
function objCell(a){const f=a.f||{};let o="";
  if(f.SKU)o=`<div class="cn">${h(f.SKU)}</div><div class="idl">ASIN ${h(f.ASIN)}</div>`;
  else if(f.关键词)o=`<span class="kw">${h(f.关键词)}</span><span class="mt">${h(f.匹配)}</span>${f["关键词 ID"]?`<div class="idl">关键词 ID ${h(f["关键词 ID"])}</div>`:""}`;
  else if(f.定位)o=`<span class="kw">${h(f.定位)}</span>${f["定位 ID"]?`<div class="idl">定位 ID ${h(f["定位 ID"])}</div>`:""}`;
  else if(f.实体==="Campaign"||f.实体==="Ad Group")o=`<span class="kw">${h(a.object)}</span>`;
  else o=`${h(a.object)}${f.ASIN?`<div class="idl">ASIN ${h(f.ASIN)}</div>`:""}`;
  return `${f.实体?`<span class="ent">${h(f.实体)}${f.操作?` · ${h(f.操作)}`:""}</span><br>`:""}${o}`}
function chgCell(a){const f=a.f||{};const o=f.现值??a.old,n=f.新值??a.new;return `<div class="sub2">${h(f.改什么||"")}</div><span>${h(o)}</span><span class="arrow">→</span><span class="nv">${h(n)}</span>`}

/* ───────── ⑤ 分类审批 ───────── */
function goApprove(type){UI.apType=type;UI.apStatus="待审批";UI.apOpt="全部";UI.openGroups.add(type);render();document.getElementById("s5")?.scrollIntoView({behavior:"smooth"})}
function s5(){const ver=S.task.version,all=S.actions;const base=all.filter(a=>UI.showVoid||a.status!=="作废");
  const stOk=a=>UI.apStatus==="全部"||(UI.apStatus==="待审批"?a.status==="待确认":a.status==="驳回");
  const optOk=a=>UI.apOpt==="全部"||a.item===UI.apOpt, tyOk=a=>!UI.apType||a.type===UI.apType;
  const fc={待审批:base.filter(a=>a.status==="待确认").length,已驳回:base.filter(a=>a.status==="驳回").length,全部:base.length};
  const oc={全部:base.filter(stOk).length};base.filter(stOk).forEach(a=>oc[a.item]=(oc[a.item]||0)+1);
  const rows=base.filter(a=>stOk(a)&&optOk(a)&&tyOk(a)),groups={};rows.forEach(a=>{const g=a.version===ver?a.type:`${a.type} · 上一版 v${a.version}`;(groups[g]=groups[g]||{type:a.type,item:a.item,cur:a.version===ver,list:[]}).list.push(a)});
  const gh=Object.entries(groups).map(([g,G])=>{const pend=G.list.filter(a=>a.status==="待确认").length,ch=chOf(G.type);
    return `<details class="grp" ${UI.openGroups.has(g)?"open":""} ontoggle="UI.openGroups[this.open?'add':'delete']('${h(jsq(g))}')"><summary>${ic("chev").replace('class="i"','class="i chev"')}<span class="key" style="width:20px;height:20px;border-radius:5px;border:1.5px solid var(--axis);display:inline-flex;align-items:center;justify-content:center;font-size:11px">${h(G.item)}</span>${h(g)} <span class="chip">${G.list.length} 条</span><span class="chn">${h(ch.通道)}</span><span class="sp">${pend?`<span class="chip warn">${pend} 条待审批</span>`:""}${pend&&G.cur?B({label:"这一类全部通过",icon:"done2",cls:"success sm",on:`event.preventDefault();bulk('${jsq(G.type)}')`,perm:"点动作"}):""}</span></summary>
    <div class="tw" style="border:0;border-radius:0"><table class="acts"><thead><tr><th>编号</th><th>Campaign / 广告组</th><th>对象</th><th>改什么</th><th>依据</th><th>审批</th></tr></thead><tbody>${G.list.map(a=>rowHtml(a,"ap")).join("")}</tbody></table></div></details>`}).join("");
  const seg=(cur,opts,set)=>`<div class="seg">${opts.map(([v,n])=>`<button class="${v===cur?"on":""}" onclick="${set}='${v}';render()">${v}<span class="n">${n}</span></button>`).join("")}</div>`;
  const bar=`<span class="flabel" style="margin:0">状态</span>${seg(UI.apStatus,[["待审批",fc.待审批],["已驳回",fc.已驳回],["全部",fc.全部]],"UI.apStatus")}<span class="flabel" style="margin:0 0 0 6px">对策</span>${seg(UI.apOpt,[["全部",oc.全部],...["A","B","C","D","E"].filter(k=>oc[k]).map(k=>[k,oc[k]])],"UI.apOpt")}
    ${UI.apType?`<span class="chip on" style="line-height:24px">类型：${h(UI.apType)} <a href="javascript:void 0" onclick="UI.apType=null;render()" style="text-decoration:none;margin-left:4px">✕</a></span>`:""}
    <div class="r"><label class="hint" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" ${UI.showVoid?"checked":""} onchange="UI.showVoid=this.checked;render()"> 显示作废</label></div>`;
  const cnt={};all.forEach(a=>cnt[a.status]=(cnt[a.status]||0)+1);const vis=ST_ORDER.filter(s=>cnt[s]&&s!=="作废");
  return panel("s5","5","分类审批","动作按类型分好，人逐条或整类审批；驳回要写理由，下一轮 Agent 会读",`<span class="chip">当前 v${ver}</span><span class="chip ${S.checks.every(c=>c.通过)?"on":"warn"}">验证器 ${S.checks.filter(c=>c.通过).length}/${S.checks.length} 通过</span>`,
    `${cmpHtml()}<div class="sbar" role="img" aria-label="动作状态分布">${vis.map(s=>`<i style="flex:${cnt[s]};background:var(${ST[s]})" title="${s} ${cnt[s]} 条"></i>`).join("")}</div><div class="legend">${ST_ORDER.filter(s=>cnt[s]).map(s=>`<span><i style="background:var(${ST[s]})"></i>${s==="待确认"?"待审批":s} <b>${cnt[s]}</b></span>`).join("")}</div>${gh||`<p class="hint" style="padding:20px 0;text-align:center">${UI.apStatus==="待审批"?"没有待审批的动作了。审批通过的在下面「执行」里。":"这个筛选下没有动作。"}</p>`}`,
    `<div class="toolbar">${bar}</div>`)}
function cmpHtml(){const v=S.task.version;if(v<2)return "";const prev=S.actions.filter(a=>a.version===v-1),cur=S.actions.filter(a=>a.version===v);if(!prev.length)return "";
  const cnt=l=>{const c={};l.forEach(a=>c[a.type]=(c[a.type]||0)+1);return c};const pc=cnt(prev),cc=cnt(cur);const types=[...new Set([...Object.keys(pc),...Object.keys(cc)])].filter(t=>(pc[t]||0)!==(cc[t]||0));
  const st={};prev.forEach(a=>st[a.status]=(st[a.status]||0)+1);const rev=prev.filter(a=>a.note&&a.status==="已确认").length,last=S.runs.find(r=>r.version===v),pl=S.runs.find(r=>r.version===v-1);
  const diff=last&&pl?Object.keys(last.inputs).filter(k=>JSON.stringify(last.inputs[k])!==JSON.stringify(pl.inputs[k])).map(k=>`${k}：${JSON.stringify(pl.inputs[k])} → ${JSON.stringify(last.inputs[k])}`).join("；"):"";
  return `<div class="cmp"><span>v${v-1} → v${v}${diff?`，因为 <b style="font-size:13.5px">${h(diff)}</b>`:""}</span><span>新动作 <b>${cur.length}</b></span><span>作废 <b>${st["作废"]||0}</b></span><span>人处理过的保留 <b>${(st["已确认"]||0)+(st["驳回"]||0)+(st["已执行"]||0)+(st["已验证"]||0)}</b></span><span>请复核 <b>${rev}</b></span>${types.map(t=>`<span class="chg">${h(t)} <b>${pc[t]||0} → ${cc[t]||0}</b></span>`).join("")}</div>`}
function rowHtml(a,mode){let ops="";const b=(txt,st,cls,icon)=>B({label:txt,icon,cls:"sm "+cls,on:`act('${a.no}','${st}')`,perm:"点动作"});
  if(a.status==="待确认")ops=b("通过","已确认","success","check")+B({label:"驳回",icon:"x",cls:"sm danger",perm:"点动作",on:`UI.rejecting='${a.no}';render();setTimeout(()=>document.getElementById('rj')?.focus(),30)`});
  if(a.status==="已确认")ops=mode==="ex"?b("标为已执行","已执行","soft","bolt")+b("撤回审批","待确认","ghost","undo"):b("撤回","待确认","ghost","undo");
  if(a.status==="驳回")ops=b("撤回驳回","待确认","ghost","undo");if(a.status==="已执行")ops=b("下周已验证","已验证","soft","done2")+b("撤回","已确认","ghost","undo");
  const rj=UI.rejecting===a.no?`<div class="rej"><div class="ipt"><input id="rj" type="text" placeholder="驳回理由（必填，下一轮 Agent 要读）" onkeydown="if((event.key==='Enter'||event.keyCode===13)&&!event.isComposing)act('${a.no}','驳回',this.value)"></div><button class="btn sm danger solid" onclick="act('${a.no}','驳回',document.getElementById('rj').value)">提交驳回</button><button class="btn sm ghost" onclick="UI.rejecting=null;render()">取消</button></div>`:"";
  return `<tr class="${a.status==="作废"?"void":""}"><td class="mono" style="white-space:nowrap">${h(a.no)}</td><td>${campCell(a)}</td><td>${objCell(a)}</td><td style="white-space:nowrap">${chgCell(a)}</td><td>${h(a.why)}${a.spend!=null?`<div class="note">近 14 天涉及 ${usd(a.spend)}</div>`:""}</td><td><div class="ops">${stHtml(a.status)}${ops}</div>${a.by?`<div class="note">${h(a.by)} · ${h((a.updated_at||"").slice(5,16))}</div>`:""}${a.reason?`<div class="note">理由：${h(a.reason)}</div>`:""}${a.note?`<div class="note warn">${h(a.note)}</div>`:""}${rj}</td></tr>`}

/* ───────── ⑥ 调用工具执行 · 下周看结果 ───────── */
function s6(F){const c=S.card,days=Math.ceil((new Date(S.meta.复盘日)-new Date(S.meta.今天))/864e5),rej=S.actions.filter(a=>a.status==="驳回"),EX=["已确认","已执行","已验证"];
  const names=["1 业务问题","2 已知事实","3 判断与待证假设","4 具体动作","5 接手岗位","6 执行条件","7 完成时间","8 成本条件","9 复核证据与观察期（＝下一次运行的触发）"],chev=ic("chev").replace('class="i"','class="i chev"');
  const chs=S.tree.通道.map(ch=>{const L=S.actions.filter(a=>ch.类型.includes(a.type)),n=s=>L.filter(a=>a.status===s).length,ready=n("已确认");
    return `<div class="ch"><div class="h">${ic("plug")}${h(ch.通道)}<span class="tag ${ch.接通?"on":"off"}">${ch.接通?"人工直接定":"未接通"}</span></div><p>管：${h(ch.管什么)}</p><p style="color:var(--ink)">${h(ch.现在怎么做)}</p>
    <div class="nums"><span><b>${ready}</b>待执行</span><span><b>${n("已执行")}</b>已执行</span><span><b>${n("已验证")}</b>已验证</span></div>
    ${ready?`<a class="btn sm ${ch.id==="ads"?"primary":""}" href="/api/export.csv?status=已确认&types=${encodeURIComponent(ch.类型.join(","))}">${ic("dl")}${ch.id==="ads"?"导出批量上传表":"导出清单"}</a>`:`<span class="hint">审批通过的会出现在这里</span>`}</div>`}).join("");
  const exGroups=S.tree.通道.map(ch=>{const L=S.actions.filter(a=>ch.类型.includes(a.type)&&EX.includes(a.status));if(!L.length)return "";const k="ex:"+ch.id;
    return `<details class="grp" ${UI.exOpen.has(k)||UI.exOpen.size===0?"open":""} ontoggle="UI.exOpen[this.open?'add':'delete']('${k}')"><summary>${chev}${h(ch.通道)} <span class="chip">${L.length} 条</span></summary><div class="tw" style="border:0;border-radius:0"><table class="acts"><thead><tr><th>编号</th><th>Campaign / 广告组</th><th>对象</th><th>改什么</th><th>依据</th><th>执行</th></tr></thead><tbody>${L.map(a=>rowHtml(a,"ex")).join("")}</tbody></table></div></details>`}).join("");
  const watch=`<div class="watch"><div class="big">${days}<small> 天后</small></div><div><b>${h(S.meta.复盘日)} 看结果</b>（下一次运行的触发）<div style="margin-top:4px">${md(c.fields[8]||"")}</div></div></div>`;
  const right=`<div class="box"><div class="bh">行动卡 ${h(c.no)}<span class="r chip on">${h(c.status)}</span></div><div class="bb" style="padding-top:4px">${c.fields.map((f,i)=>`<details class="cardf ${i===8?"key":""}" ${i===0?"open":""}><summary>${chev}${names[i]}</summary><div>${md(f)}</div></details>`).join("")}</div></div>`;
  const left=`<div class="stack"><div class="box"><div class="bh">人驳回过的<span class="r hint">下一圈不再原样提</span></div>${rej.length?`<div class="tw" style="border:0"><table><tbody>${rej.map(a=>`<tr><td class="mono" style="white-space:nowrap">${h(a.no)}</td><td>${h(a.type)}｜${h((a.f&&(a.f.SKU||a.f.关键词))||a.object)}</td><td>${h(a.reason)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="bb hint">还没有驳回。驳回理由会留在这里，下一圈 Agent 先读它。</div>`}</div>
  <div class="box"><div class="bh">回测<span class="r hint">如果当初照粗规则否词，这些词后来怎样</span></div><div class="tw" style="border:0;border-radius:0 0 11px 11px"><table><thead><tr>${Object.keys(F.回测[0]).map(k=>`<th class="num">${h(k)}</th>`).join("")}</tr></thead><tbody>${F.回测.map(r=>`<tr>${Object.values(r).map(v=>`<td class="num">${h(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
  <div class="box"><div class="bh">运行历史<span class="r chip">${S.runs.length} 次</span></div><div class="tw" style="border:0;border-radius:0 0 11px 11px"><table><thead><tr><th>版本</th><th>时间</th><th>触发</th><th>输入</th><th class="num">动作</th><th class="num">用时</th></tr></thead><tbody>${S.runs.map(r=>`<tr><td><span class="vtag">v${r.version}</span></td><td style="white-space:nowrap">${h(r.at.slice(5,16))}</td><td>${h(r.trigger)}</td><td>目标 ${pct(r.inputs.目标ACOS,0)}｜到仓 ${r.inputs.补货到仓周数} 周｜${h(r.inputs.产品阶段)}｜取舍 ${r.inputs.取舍项.join("")}</td><td class="num">${r.summary.合计}</td><td class="num">${r.seconds} 秒</td></tr>`).join("")}</tbody></table></div></div></div>`;
  return panel("s6","6","调用工具执行 · 下周看结果","审批通过的动作按通道交给工具；工具没接通时导出给人上传。执行后到复盘日看结果",`<span class="chip warn">${ic("cal","width:12px;height:12px")}复盘日 ${h(S.meta.复盘日)}</span>`,
  `<div class="chs">${chs}</div>${exGroups?`<div class="sub-h">执行清单</div>${exGroups}`:""}<div class="sub-h" style="margin-top:20px">下周看结果</div>${watch}<div class="grid2">${left}${right}</div>
  <div class="box" style="margin-top:16px"><div class="bh">操作记录<span class="r hint">谁、什么时候、做了什么</span></div><div class="log">${S.events.map(e=>`<div><span>${h(e.at.slice(5))}</span><b>${h(e.who)}</b><span>${h(e.kind)}</span><span style="color:var(--ink)">${h(e.ref)}　${h(e.detail)}</span></div>`).join("")}</div></div>
  <div class="prov">${ic("db")}<span><b style="color:var(--ink)">数据怎么来的：</b>全部是只读查询：${Object.entries(S.calls).map(([k,v])=>`<code>${h(k.split("/").slice(-2).join("/"))}</code>×${v}`).join("　")}。${h(S.meta.数据标记)}${S.mapped?"。Campaign、广告组、ASIN、SKU、各类 ID 都是脱敏生成的，格式与广告后台一致，不对应任何真实对象":""}。${h(S.meta.归因未满)} 归因未满。</span></div>`)}

// 侧栏高亮当前所在分区
function spy(){const ids=["loop","hist","s1","tree","s5","s6"];let cur=ids[0];for(const id of ids){const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<220)cur=id}
  if(cur!==UI.sec){UI.sec=cur}document.querySelectorAll("#snav a").forEach(a=>a.classList.toggle("on",a.dataset.s===cur))}
addEventListener("scroll",()=>{cancelAnimationFrame(spy.f);spy.f=requestAnimationFrame(spy)},{passive:true});

async function load(){S=await api("/api/state");render()}
async function act(no,status,reason){try{await api("/api/action/"+encodeURIComponent(no),{status,reason});UI.rejecting=null;await load()}catch(e){}}
async function bulk(type){try{const r=await api("/api/bulk",{type});toast(`已通过 ${r.n} 条，去「执行」里导出`);await load()}catch(e){}}
async function saveInputs(){const a=$("#in_acos").value,w=$("#in_weeks").value;try{const r=await api("/api/inputs",{target_acos:a===""?"":a/100,arrive_weeks:w,stage:$("#in_stage").value});toast(r.changed.length?"目标已保存，任务回到「待处理」。点「跑一圈」":"目标没有变化");await load()}catch(e){}}
async function retrigger(){try{await api("/api/inputs",{retrigger:true});toast("已重新触发（目标没动）。点「跑一圈」看它会不会重复跑");await load()}catch(e){}}
async function saveOpts(){try{await api("/api/inputs",{options:[...UI.opts]});UI.opts=null;toast("取舍已改，任务回到「待处理」。点「跑一圈」");await load()}catch(e){UI.opts=null;render()}}
async function runLoop(){try{await api("/api/run",{trigger:S.hasRun?"改输入重跑":"手动"})}catch(e){return}UI.playing=true;UI.shown=0;UI.cur=1;UI.openSteps.clear();if(isDemo())[1,2,3,4,5,6].forEach(i=>UI.openSteps.add(i));render();document.getElementById("loop")?.scrollIntoView({behavior:"auto"});
  const tick=async()=>{const p=await (await fetch("/api/progress")).json();S.progress=p;if(UI.shown<p.steps.length){UI.shown++;const nx=p.steps[UI.shown];UI.cur=nx?nx.i:(p.running?Math.min(6,(p.steps.at(-1)?.i||0)+1):0);render();return setTimeout(tick,isDemo()?1400:650)}
    if(p.running){UI.cur=Math.min(6,(p.steps.at(-1)?.i||0)+1);render();return setTimeout(tick,350)}UI.playing=false;UI.cur=0;UI.opts=null;UI.sel=null;await load();toast(p.steps.every(s=>s.ok)?"这一圈跑完了，停下来等人审批":"这一圈停在了异常：看红色那一格")};setTimeout(tick,300)}
$("#run").onclick=runLoop;$("#reset").onclick=async()=>{if(!confirm("重置：清空工作台的状态库，回到还没跑过的样子。确定？"))return;try{await api("/api/reset",{});UI.opts=null;UI.sel=null;UI.openGroups.clear();toast("已重置");await load()}catch(e){}};
const Q=new URLSearchParams(location.search);if(Q.get("void"))UI.showVoid=true;if(Q.get("sel"))UI.sel=Q.get("sel");
(async()=>{S=await (await fetch("/api/state")).json();
  if(S.hasRun){const v=S.task.version,ts=[...new Set(S.actions.filter(a=>a.version===v).map(a=>a.type))];(Q.get("open")==="all"?ts:ts.slice(0,1)).forEach(t=>UI.openGroups.add(t))}
  try{const w=localStorage.getItem("who");if(w&&S.roles.includes(w))UI.who=w}catch(e){}
  const dm=$("#demo");try{dm.checked=localStorage.getItem("demo")==="1"||Q.get("demo")==="1"}catch(e){}document.body.classList.toggle("demo",dm.checked);dm.onchange=()=>{document.body.classList.toggle("demo",dm.checked);try{localStorage.setItem("demo",dm.checked?"1":"0")}catch(e){}render()};render()})();
</script></body></html>
